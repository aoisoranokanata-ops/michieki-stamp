<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="道の駅スタンプ">
<title>道の駅スタンプ帳</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface2: #eeece6; --text: #1f2421; --muted: #6b716d;
  --line: #dcd9d0; --accent: #2f6f4f; --accent-ink: #ffffff; --accent-soft: #dcebe2;
  --stamp: #b5442c; --stamp-soft: #f5e1dc; --star: #e0a21a; --danger: #b3261e;
  --radius: 14px; --tap: 48px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151816; --surface: #1f2421; --surface2: #2a302c; --text: #e9ece8; --muted: #9aa39d;
    --line: #353c37; --accent: #6cbf91; --accent-ink: #0f1a14; --accent-soft: #23382c;
    --stamp: #e8826c; --stamp-soft: #3b2722; --star: #f0b93a; --danger: #ef7b72;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  padding-bottom: calc(68px + var(--safe-b));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

header.top {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: calc(10px + var(--safe-t)) 16px 8px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; min-height: 56px;
}
header.top h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  min-width: var(--tap); height: 40px; border: 0; background: transparent; border-radius: 10px;
  font-size: 15px; color: var(--accent); padding: 0 8px; font-weight: 600;
}
.icon-btn:active { background: var(--surface2); }

main { max-width: 720px; margin: 0 auto; }
.view { display: none; padding: 12px 16px 24px; }
.view.active { display: block; }

nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex;
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
}
nav.tabs button {
  flex: 1; height: 60px; border: 0; background: transparent; color: var(--muted);
  font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
nav.tabs button .ico { font-size: 22px; line-height: 1; }
nav.tabs button.on { color: var(--accent); font-weight: 700; }

/* 検索・絞り込み */
.search { position: relative; margin-bottom: 10px; }
.search input {
  width: 100%; height: var(--tap); border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 40px 0 14px; font-size: 16px;
}
.search .clear { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 18px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters select {
  height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 12px; font-size: 15px; flex: 0 0 auto; max-width: 70vw;
}
.filters select.set { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.count-line { color: var(--muted); font-size: 13px; margin: 6px 2px 8px; display: flex; justify-content: space-between; }

/* 一覧 */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  background: var(--surface); border-radius: var(--radius); padding: 12px 14px; min-height: 64px;
  display: flex; align-items: center; gap: 12px; border: 1px solid transparent; width: 100%; text-align: left;
}
.item:active { background: var(--surface2); }
.item .main { flex: 1; min-width: 0; }
.item .name { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; gap: 4px; flex: 0 0 auto; }
.badge {
  font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.badge.v { background: var(--accent-soft); color: var(--accent); }
.badge.s { background: var(--stamp-soft); color: var(--stamp); }
.badge.n { background: var(--surface2); color: var(--muted); }
.more { width: 100%; height: var(--tap); margin-top: 10px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

/* 詳細 */
.card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.place-head h2 { margin: 0; font-size: 22px; line-height: 1.3; }
.place-head .kana { color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 10px; font-size: 14px; margin-top: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--muted); }
.status-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.section-title { font-size: 14px; color: var(--muted); font-weight: 700; margin: 18px 2px 8px; display: flex; justify-content: space-between; align-items: center; }

.btn {
  height: var(--tap); border-radius: 12px; border: 0; padding: 0 18px; font-weight: 700; font-size: 16px;
  background: var(--accent); color: var(--accent-ink); width: 100%;
}
.btn.ghost { background: var(--surface2); color: var(--text); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn:active { filter: brightness(.92); }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }

.visit {
  background: var(--surface); border-radius: var(--radius); padding: 12px 14px; width: 100%;
  border: 0; text-align: left; display: block;
}
.visit:active { background: var(--surface2); }
.visit .top-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.visit .date { font-weight: 700; }
.visit .text { margin-top: 4px; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.visit .place { font-size: 13px; color: var(--accent); font-weight: 700; }
.stars-inline { color: var(--star); letter-spacing: 1px; font-size: 14px; }

/* フォーム */
.field { margin-bottom: 16px; }
.field > label, .field > .label { display: block; font-size: 14px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.field input[type=text], .field input[type=date], .field select, .field textarea {
  width: 100%; min-height: var(--tap); border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); padding: 10px 12px; font-size: 16px;
}
.field textarea { min-height: 110px; resize: vertical; }
.toggle-row { display: flex; gap: 10px; }
.toggle {
  flex: 1; min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface);
  font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px;
}
.toggle[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.toggle.stamp[aria-pressed=true] { border-color: var(--stamp); background: var(--stamp-soft); color: var(--stamp); }
.stars { display: flex; gap: 2px; }
.stars button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 30px; color: var(--line); padding: 0; line-height: 1; }
.stars button.on { color: var(--star); }
.stars.small button { width: 36px; height: 36px; font-size: 24px; }
.detail-ratings { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 12px; }
.detail-ratings span { font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.banner { background: var(--stamp-soft); color: var(--stamp); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
.settings p { margin: 6px 0; font-size: 14px; }
.settings h3 { font-size: 15px; margin: 0 0 8px; }
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="backBtn" hidden aria-label="戻る">‹ 戻る</button>
  <h1 id="title">道の駅スタンプ帳</h1>
  <button class="icon-btn" id="headAction" hidden></button>
</header>

<main>
  <!-- 一覧 -->
  <section class="view" id="v-list">
    <div id="loadBanner"></div>
    <div class="search">
      <input id="q" type="search" placeholder="名前・よみ・市町村で検索" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qClear" aria-label="検索語を消す" hidden>✕</button>
    </div>
    <div class="filters">
      <select id="fPref" aria-label="都道府県"><option value="">全国</option></select>
      <select id="fVisit" aria-label="訪問状況">
        <option value="">訪問：すべて</option><option value="yes">訪問済み</option><option value="no">未訪問</option>
      </select>
      <select id="fStamp" aria-label="スタンプ">
        <option value="">スタンプ：すべて</option><option value="yes">スタンプあり</option><option value="no">スタンプなし</option>
      </select>
      <select id="fSort" aria-label="並び順">
        <option value="reg">都道府県順</option><option value="kana">よみ順</option><option value="recent">最近の訪問順</option>
      </select>
    </div>
    <div class="count-line"><span id="countText"></span><span id="progressText"></span></div>
    <ul class="list" id="list"></ul>
    <button class="more" id="moreBtn" hidden>もっと表示</button>
  </section>

  <!-- 場所の詳細 -->
  <section class="view" id="v-place"></section>

  <!-- 訪問記録フォーム -->
  <section class="view" id="v-visit"></section>

  <!-- 場所の手動追加・編集 -->
  <section class="view" id="v-placeEdit"></section>

  <!-- 訪問記録一覧 -->
  <section class="view" id="v-visits">
    <ul class="list" id="visitList"></ul>
  </section>

  <!-- 設定・情報 -->
  <section class="view settings" id="v-settings"></section>
</main>

<nav class="tabs">
  <button data-tab="list"><span class="ico">🏠</span>道の駅</button>
  <button data-tab="visits"><span class="ico">📝</span>訪問記録</button>
  <button data-tab="settings"><span class="ico">⚙️</span>設定</button>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP_VERSION = '0.1.0';
const APP_KEY = 'michieki-stamp';           // DB名・localStorageキーの接頭辞（github.io は他アプリと同一オリジン）
const DATA_URL = 'data/michinoeki.json';
const RATING_ITEMS = [['food', '食'], ['view', '景色'], ['facility', '設備'], ['stamp', 'スタンプ']];
const PREFS = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];

/* ---------- 小物 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('sv-SE');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const kataToHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const normQ = s => kataToHira(String(s ?? '').normalize('NFKC').toLowerCase()).replace(/[\s・･]/g, '');
const starsText = n => n ? '★'.repeat(n) + '☆'.repeat(5 - n) : '';
const fmtDate = d => d ? d.replace(/-/g, '/') : '';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(`${APP_KEY}:${k}`); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(`${APP_KEY}:${k}`, JSON.stringify(v)); } catch {} },
};
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- IndexedDB ---------- */
// v1 で後続フェーズのストアまで作っておく（スキーマ移行を減らすため）
const db = {
  conn: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(APP_KEY, 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        const places = d.createObjectStore('places', { keyPath: 'id' });
        places.createIndex('type', 'type');
        places.createIndex('prefecture', 'prefecture');
        const visits = d.createObjectStore('visits', { keyPath: 'id' });
        visits.createIndex('placeId', 'placeId');
        visits.createIndex('visitedDate', 'visitedDate');
        const stamps = d.createObjectStore('stamps', { keyPath: 'id' });
        stamps.createIndex('placeId', 'placeId');
        stamps.createIndex('visitId', 'visitId');
        stamps.createIndex('kind', 'kind');
        d.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = () => { this.conn = req.result; resolve(); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => toast('別のタブでアプリを開いていると更新できません');
    });
  },
  tx(stores, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = this.conn.transaction(stores, mode);
      let result;
      Promise.resolve(fn(t)).then(r => { result = r; });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  },
  all(store) {
    return this.tx([store], 'readonly', t => new Promise(r => { const q = t.objectStore(store).getAll(); q.onsuccess = () => r(q.result); }));
  },
  get(store, key) {
    return this.tx([store], 'readonly', t => new Promise(r => { const q = t.objectStore(store).get(key); q.onsuccess = () => r(q.result); }));
  },
  put(store, val) { return this.tx([store], 'readwrite', t => { t.objectStore(store).put(val); }); },
  del(store, key) { return this.tx([store], 'readwrite', t => { t.objectStore(store).delete(key); }); },
};

/* ---------- 状態 ---------- */
const state = {
  places: new Map(),      // id -> place
  visits: [],             // 全訪問記録
  byPlace: new Map(),     // placeId -> {visits:[], visited, stamp, last}
  listLimit: 80,
};

function reindexVisits() {
  state.byPlace = new Map();
  for (const v of state.visits) {
    let s = state.byPlace.get(v.placeId);
    if (!s) state.byPlace.set(v.placeId, s = { visits: [], visited: false, stamp: false, last: '' });
    s.visits.push(v);
    if (v.visited) s.visited = true;
    if (v.stampObtained) s.stamp = true;
    if (v.visitedDate > s.last) s.last = v.visitedDate;
  }
  for (const s of state.byPlace.values()) s.visits.sort((a, b) => b.visitedDate.localeCompare(a.visitedDate) || b.createdAt - a.createdAt);
}

function searchKey(p) {
  return normQ(`${p.name} ${p.nameKana || ''} ${p.address || ''}`);
}

/* ---------- 道の駅データの取り込み ---------- */
// 同梱 JSON の版が変わったら差分で更新する。訪問記録・手動追加分・利用者が直した位置は残す
async function syncImportData() {
  let data;
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    if (state.places.size === 0) $('#loadBanner').innerHTML = '<div class="banner">道の駅データを読み込めませんでした。通信できる場所でもう一度開いてください。</div>';
    return false;
  }
  const meta = await db.get('meta', 'dataVersion');
  if (meta && meta.value === data.version && state.places.size > 0) return false;

  const incoming = new Set();
  await db.tx(['places'], 'readwrite', t => {
    const store = t.objectStore('places');
    data.places.forEach((r, ord) => {
      incoming.add(r.id);
      const old = state.places.get(r.id);
      const p = {
        ...(old || {}),
        id: r.id, type: 'michinoeki', source: 'import',
        name: r.name, nameKana: r.kana, prefecture: data.prefs[r.pref - 1], address: r.addr,
        regRound: r.round, regDate: (r.reg || '').trim(), url: r.url || '', closed: false, ord,
      };
      if (!old || !old.geoUserSet) { p.lat = r.lat ?? null; p.lng = r.lng ?? null; p.geoPrecision = r.prec; }
      store.put(p);
      state.places.set(p.id, p);
    });
    // 一覧から消えた駅は削除せず「登録抹消・閉鎖」扱いにする（記録が紐づいている可能性があるため）
    for (const p of state.places.values()) {
      if (p.source === 'import' && p.type === 'michinoeki' && !incoming.has(p.id) && !p.closed) {
        p.closed = true; store.put(p);
      }
    }
  });
  await db.put('meta', { key: 'dataVersion', value: data.version, count: data.count, sources: data.sources });
  return true;
}

/* ---------- ルーティング ---------- */
// #/list, #/place/<id>, #/visit/new/<placeId>, #/visit/<id>, #/place-new, #/place-edit/<id>, #/visits, #/settings
const scrollPos = {};
let currentView = null;

function go(hash) { location.hash = hash; }

function showView(name, title, { back = false, action = null } = {}) {
  if (currentView) scrollPos[currentView] = window.scrollY;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + name));
  $('#title').textContent = title;
  $('#backBtn').hidden = !back;
  const ha = $('#headAction');
  ha.hidden = !action;
  if (action) { ha.textContent = action.label; ha.onclick = action.fn; }
  const tab = { list: 'list', place: 'list', placeEdit: 'list', visit: 'list', visits: 'visits', settings: 'settings' }[name];
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const prev = currentView;
  currentView = name;
  // 一覧に戻ったときはスクロール位置を復元、それ以外は先頭へ
  requestAnimationFrame(() => window.scrollTo(0, (name === 'list' || name === 'visits') && prev !== name ? (scrollPos[name] || 0) : 0));
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/list');
  const parts = h.split('/').filter(Boolean);
  const [a, b, ...rest] = parts;
  if (a === 'place' && b) return renderPlace([b, ...rest].join('/'));
  if (a === 'visit' && b === 'new') return renderVisitForm(null, rest.join('/'));
  if (a === 'visit' && b) return renderVisitForm(b);
  if (a === 'place-new') return renderPlaceEdit(null);
  if (a === 'place-edit' && b) return renderPlaceEdit([b, ...rest].join('/'));
  if (a === 'visits') { renderVisits(); return showView('visits', '訪問記録'); }
  if (a === 'settings') { renderSettings(); return showView('settings', '設定・情報'); }
  renderList();
  showView('list', '道の駅スタンプ帳', { action: { label: '＋追加', fn: () => go('/place-new') } });
}

function back() {
  if (history.length > 1) history.back(); else go('/list');
}

/* ---------- 一覧 ---------- */
const filters = ls.get('filters', { q: '', pref: '', visit: '', stamp: '', sort: 'reg' });

function initListControls() {
  const fPref = $('#fPref');
  PREFS.forEach(p => fPref.insertAdjacentHTML('beforeend', `<option>${p}</option>`));
  $('#q').value = filters.q; fPref.value = filters.pref; $('#fVisit').value = filters.visit;
  $('#fStamp').value = filters.stamp; $('#fSort').value = filters.sort;
  let timer;
  $('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { filters.q = $('#q').value; onFilter(); }, 150); });
  $('#qClear').addEventListener('click', () => { $('#q').value = ''; filters.q = ''; onFilter(); $('#q').focus(); });
  for (const [id, key] of [['#fPref', 'pref'], ['#fVisit', 'visit'], ['#fStamp', 'stamp'], ['#fSort', 'sort']]) {
    $(id).addEventListener('change', e => { filters[key] = e.target.value; onFilter(); });
  }
  $('#moreBtn').addEventListener('click', () => { state.listLimit += 200; renderList(); });
}
function onFilter() { state.listLimit = 80; ls.set('filters', filters); renderList(); window.scrollTo(0, 0); }

function filteredPlaces() {
  const q = normQ(filters.q);
  let arr = [];
  for (const p of state.places.values()) {
    if (p.type !== 'michinoeki') continue;
    if (filters.pref && p.prefecture !== filters.pref) continue;
    const s = state.byPlace.get(p.id);
    if (filters.visit === 'yes' && !s?.visited) continue;
    if (filters.visit === 'no' && s?.visited) continue;
    if (filters.stamp === 'yes' && !s?.stamp) continue;
    if (filters.stamp === 'no' && s?.stamp) continue;
    if (q) { p._k ??= searchKey(p); if (!p._k.includes(q)) continue; }
    arr.push(p);
  }
  const prefIdx = p => PREFS.indexOf(p.prefecture);
  if (filters.sort === 'kana') arr.sort((a, b) => (a.nameKana || a.name).localeCompare(b.nameKana || b.name, 'ja'));
  else if (filters.sort === 'recent') arr.sort((a, b) => (state.byPlace.get(b.id)?.last || '').localeCompare(state.byPlace.get(a.id)?.last || '') || prefIdx(a) - prefIdx(b));
  else arr.sort((a, b) => prefIdx(a) - prefIdx(b) || (a.ord ?? 1e9) - (b.ord ?? 1e9) || a.name.localeCompare(b.name, 'ja'));
  return arr;
}

function badgesHtml(p) {
  const s = state.byPlace.get(p.id);
  let h = '';
  if (p.closed) h += '<span class="badge n">閉鎖?</span>';
  if (s?.stamp) h += '<span class="badge s">スタンプ</span>';
  if (s?.visited) h += `<span class="badge v">訪問${s.visits.filter(v => v.visited).length > 1 ? '×' + s.visits.filter(v => v.visited).length : ''}</span>`;
  return h;
}

function renderList() {
  for (const el of ['#fPref', '#fVisit', '#fStamp']) $(el).classList.toggle('set', !!$(el).value);
  $('#qClear').hidden = !filters.q;
  const arr = filteredPlaces();
  const total = [...state.places.values()].filter(p => p.type === 'michinoeki' && !p.closed);
  const visited = total.filter(p => state.byPlace.get(p.id)?.visited).length;
  $('#countText').textContent = `${arr.length.toLocaleString()} 件`;
  $('#progressText').textContent = total.length ? `訪問 ${visited} / ${total.length}` : '';
  const shown = arr.slice(0, state.listLimit);
  $('#list').innerHTML = shown.length ? shown.map(p => `
    <li><button class="item" data-id="${esc(p.id)}">
      <div class="main">
        <div class="name">${esc(p.name)}</div>
        <div class="sub">${esc(p.address || p.prefecture || '')}${p.source === 'manual' ? '・手動追加' : ''}</div>
      </div>
      <div class="badges">${badgesHtml(p)}</div>
    </button></li>`).join('')
    : `<li class="empty">${state.places.size ? '条件に合う道の駅がありません' : '読み込み中…'}</li>`;
  $('#moreBtn').hidden = arr.length <= state.listLimit;
  $('#moreBtn').textContent = `もっと表示（残り ${(arr.length - state.listLimit).toLocaleString()} 件）`;
}

/* ---------- 場所の詳細 ---------- */
function renderPlace(id) {
  const p = state.places.get(id);
  if (!p) { go('/list'); return; }
  const s = state.byPlace.get(id);
  const visits = s?.visits || [];
  const geo = p.lat == null ? '位置情報なし'
    : p.geoPrecision === 'city' ? '位置は市町村の代表点（概略）です'
    : p.geoPrecision === 'osm' ? '位置は OpenStreetMap の登録地点です' : '';
  $('#v-place').innerHTML = `
    <div class="card place-head">
      <h2>${esc(p.name)}</h2>
      ${p.nameKana ? `<div class="kana">${esc(p.nameKana)}</div>` : ''}
      <div class="status-row">
        ${s?.visited ? `<span class="badge v">訪問済み ${visits.filter(v => v.visited).length}回</span>` : '<span class="badge n">未訪問</span>'}
        ${s?.stamp ? '<span class="badge s">スタンプ取得済み</span>' : ''}
        ${p.closed ? '<span class="badge n">最新の一覧に無し（閉鎖・改称の可能性）</span>' : ''}
      </div>
      <dl class="kv">
        <dt>所在地</dt><dd>${esc(p.address || '—')}</dd>
        ${p.regRound ? `<dt>登録</dt><dd>${esc(p.regRound)}（${esc(p.regDate)}）</dd>` : ''}
        ${p.url ? `<dt>公式</dt><dd><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a></dd>` : ''}
        ${p.source === 'manual' ? '<dt>登録元</dt><dd>手動追加</dd>' : ''}
      </dl>
      ${geo ? `<div class="note" style="margin-top:8px">${geo}</div>` : ''}
    </div>
    <button class="btn" id="addVisit">＋ 訪問を記録</button>
    <div class="section-title"><span>訪問記録</span><span>${visits.length}件</span></div>
    <ul class="list">${visits.length ? visits.map(visitItemHtml).join('') : '<li class="empty">まだ記録がありません</li>'}</ul>
    ${p.source === 'manual' ? '<div class="btn-row"><button class="btn ghost" id="editPlace">この場所を編集</button></div>' : ''}
  `;
  $('#addVisit').onclick = () => go('/visit/new/' + encodeURIComponent(id));
  const ep = $('#editPlace'); if (ep) ep.onclick = () => go('/place-edit/' + encodeURIComponent(id));
  showView('place', p.name, { back: true });
}

function visitItemHtml(v, withPlace = false) {
  const p = withPlace ? state.places.get(v.placeId) : null;
  const text = [v.impression, v.memo].filter(Boolean).join(' / ');
  return `<li><button class="visit" data-visit="${esc(v.id)}">
    ${p ? `<div class="place">${esc(p.name)}<span class="note">　${esc(p.prefecture || '')}</span></div>` : ''}
    <div class="top-line">
      <span class="date">${fmtDate(v.visitedDate)}</span>
      ${v.visited ? '' : '<span class="badge n">未入場</span>'}
      ${v.stampObtained ? '<span class="badge s">スタンプ</span>' : ''}
      <span class="stars-inline">${starsText(v.ratingOverall)}</span>
    </div>
    ${text ? `<div class="text">${esc(text)}</div>` : ''}
  </button></li>`;
}

/* ---------- 訪問記録フォーム ---------- */
function starPicker(name, value, small = false) {
  return `<div class="stars${small ? ' small' : ''}" data-stars="${name}" data-value="${value || 0}">
    ${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n <= (value || 0) ? 'on' : ''}" aria-label="${n}">★</button>`).join('')}
  </div>`;
}
function bindStars(root) {
  root.querySelectorAll('.stars').forEach(box => {
    box.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const n = +b.dataset.n;
      const v = +box.dataset.value === n ? 0 : n;   // 同じ星をもう一度押すと解除
      box.dataset.value = v;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= v));
    });
  });
}

async function renderVisitForm(visitId, placeIdForNew) {
  let v;
  if (visitId) {
    v = state.visits.find(x => x.id === visitId);
    if (!v) { go('/list'); return; }
  } else {
    v = { id: null, placeId: placeIdForNew, visitedDate: today(), visited: true, stampObtained: false,
          ratingOverall: 0, ratingDetails: {}, impression: '', memo: '' };
  }
  const p = state.places.get(v.placeId);
  if (!p) { go('/list'); return; }
  const el = $('#v-visit');
  el.innerHTML = `
    <div class="note" style="margin-bottom:12px">${esc(p.name)}${p.prefecture ? '（' + esc(p.prefecture) + '）' : ''}</div>
    <div class="field"><label for="fDate">訪問日</label><input type="date" id="fDate" value="${esc(v.visitedDate)}" required></div>
    <div class="field">
      <div class="toggle-row">
        <button type="button" class="toggle" id="tVisited" aria-pressed="${!!v.visited}">✓ 訪問した</button>
        <button type="button" class="toggle stamp" id="tStamp" aria-pressed="${!!v.stampObtained}">◉ スタンプ取得</button>
      </div>
      <div class="hint">スタンプが無かった・時間外だった日は「スタンプ取得」を外したまま記録できます。</div>
    </div>
    <div class="field"><div class="label">総合評価</div>${starPicker('overall', v.ratingOverall)}</div>
    <div class="field"><div class="label">項目別評価（任意）</div>
      <div class="detail-ratings">${RATING_ITEMS.map(([k, label]) => `<span>${label}</span>${starPicker(k, v.ratingDetails?.[k], true)}`).join('')}</div>
    </div>
    <div class="field"><label for="fImp">感想</label><textarea id="fImp" placeholder="印象に残ったこと">${esc(v.impression)}</textarea></div>
    <div class="field"><label for="fMemo">メモ</label><textarea id="fMemo" placeholder="営業時間・駐車場・買った物など">${esc(v.memo)}</textarea></div>
    <div class="btn-row"><button class="btn" id="saveVisit">保存</button></div>
    ${v.id ? '<div class="btn-row"><button class="btn danger" id="delVisit">この記録を削除</button></div>' : ''}
  `;
  for (const id of ['#tVisited', '#tStamp']) {
    $(id, el).onclick = e => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); };
  }
  bindStars(el);
  $('#saveVisit', el).onclick = async () => {
    const date = $('#fDate', el).value;
    if (!date) { toast('訪問日を入れてください'); return; }
    const details = {};
    for (const [k] of RATING_ITEMS) { const n = +$(`[data-stars="${k}"]`, el).dataset.value; if (n) details[k] = n; }
    const now = Date.now();
    const rec = {
      ...v, id: v.id || uid(), visitedDate: date,
      visited: $('#tVisited', el).getAttribute('aria-pressed') === 'true',
      stampObtained: $('#tStamp', el).getAttribute('aria-pressed') === 'true',
      ratingOverall: +$('[data-stars="overall"]', el).dataset.value || 0,
      ratingDetails: details,
      impression: $('#fImp', el).value.trim(), memo: $('#fMemo', el).value.trim(),
      createdAt: v.createdAt || now, updatedAt: now,
    };
    await db.put('visits', rec);
    const i = state.visits.findIndex(x => x.id === rec.id);
    if (i >= 0) state.visits[i] = rec; else state.visits.push(rec);
    reindexVisits();
    toast('保存しました');
    back();
  };
  const del = $('#delVisit', el);
  if (del) del.onclick = async () => {
    if (!confirm(`${fmtDate(v.visitedDate)} の記録を削除しますか？`)) return;
    await db.del('visits', v.id);
    state.visits = state.visits.filter(x => x.id !== v.id);
    reindexVisits();
    toast('削除しました');
    back();
  };
  showView('visit', v.id ? '訪問記録を編集' : '訪問を記録', { back: true });
}

/* ---------- 場所の手動追加・編集 ---------- */
function renderPlaceEdit(id) {
  const p = id ? state.places.get(id) : { name: '', nameKana: '', prefecture: filters.pref || '', address: '' };
  if (!p) { go('/list'); return; }
  const el = $('#v-placeEdit');
  el.innerHTML = `
    <p class="note" style="margin-top:0">一覧に無い新しい道の駅などを追加できます。位置のピン留めは今後のバージョンで対応します。</p>
    <div class="field"><label for="pName">名前（「道の駅」は不要）</label><input type="text" id="pName" value="${esc(p.name)}" required></div>
    <div class="field"><label for="pKana">よみ（ひらがな・任意）</label><input type="text" id="pKana" value="${esc(p.nameKana)}"></div>
    <div class="field"><label for="pPref">都道府県</label>
      <select id="pPref"><option value="">選択してください</option>${PREFS.map(x => `<option${x === p.prefecture ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label for="pAddr">所在地（任意）</label><input type="text" id="pAddr" value="${esc(p.address)}" placeholder="例：○○県△△市"></div>
    <div class="btn-row"><button class="btn" id="savePlace">保存</button></div>
    ${id ? '<div class="btn-row"><button class="btn danger" id="delPlace">この場所を削除</button></div>' : ''}
  `;
  $('#savePlace', el).onclick = async () => {
    const name = $('#pName', el).value.trim().replace(/^道の駅\s*/, '');
    const pref = $('#pPref', el).value;
    if (!name) { toast('名前を入れてください'); return; }
    if (!pref) { toast('都道府県を選んでください'); return; }
    const rec = {
      ...(id ? p : { id: 'u:' + uid(), type: 'michinoeki', source: 'manual', lat: null, lng: null, closed: false, createdAt: Date.now() }),
      name, nameKana: kataToHira($('#pKana', el).value.trim()), prefecture: pref,
      address: $('#pAddr', el).value.trim() || pref, updatedAt: Date.now(),
    };
    delete rec._k;
    await db.put('places', rec);
    state.places.set(rec.id, rec);
    toast('保存しました');
    if (id) back(); else location.replace('#/place/' + encodeURIComponent(rec.id));
  };
  const del = $('#delPlace', el);
  if (del) del.onclick = async () => {
    const n = state.byPlace.get(id)?.visits.length || 0;
    if (!confirm(n ? `この場所と訪問記録 ${n} 件を削除しますか？` : 'この場所を削除しますか？')) return;
    await db.tx(['places', 'visits'], 'readwrite', t => {
      t.objectStore('places').delete(id);
      for (const v of state.visits) if (v.placeId === id) t.objectStore('visits').delete(v.id);
    });
    state.places.delete(id);
    state.visits = state.visits.filter(v => v.placeId !== id);
    reindexVisits();
    toast('削除しました');
    go('/list');
  };
  showView('placeEdit', id ? '場所を編集' : '道の駅を手動追加', { back: true });
}

/* ---------- 訪問記録一覧 ---------- */
function renderVisits() {
  const arr = [...state.visits].sort((a, b) => b.visitedDate.localeCompare(a.visitedDate) || b.createdAt - a.createdAt);
  $('#visitList').innerHTML = arr.length ? arr.map(v => visitItemHtml(v, true)).join('')
    : '<li class="empty">まだ訪問記録がありません。<br>「道の駅」タブから場所を選んで記録できます。</li>';
}

/* ---------- 設定・情報 ---------- */
async function renderSettings() {
  const meta = await db.get('meta', 'dataVersion');
  const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : null;
  const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;
  const manual = [...state.places.values()].filter(p => p.source === 'manual').length;
  const closed = [...state.places.values()].filter(p => p.closed).length;
  $('#v-settings').innerHTML = `
    <div class="card">
      <h3>データ</h3>
      <p>道の駅：${(meta?.count ?? 0).toLocaleString()} 駅（データ版 ${esc(meta?.value || '—')}）${manual ? `／手動追加 ${manual}` : ''}${closed ? `／一覧から消えた駅 ${closed}` : ''}</p>
      <p>訪問記録：${state.visits.length} 件</p>
      <p>保存領域：${persisted === null ? '確認できません' : persisted ? '永続化済み（ブラウザに消されにくい状態）' : '未永続化（ホーム画面に追加すると消えにくくなります）'}${est ? `・使用量 約${(est.usage / 1048576).toFixed(1)}MB` : ''}</p>
    </div>
    <div class="card">
      <h3>出典</h3>
      <p>道の駅の一覧（駅名・よみ・所在地・登録回）：<a href="https://www.mlit.go.jp/road/Michi-no-Eki/list.html" target="_blank" rel="noopener">国土交通省「道の駅」一覧</a>を加工して作成。</p>
      <p>位置情報：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors（ODbL）。OSM で見つからない駅は、<a href="https://msearch.gsi.go.jp/" target="_blank" rel="noopener">国土地理院 住所検索</a>による市町村の代表点（概略位置）。</p>
      <p class="note">このアプリは国土交通省・国土地理院が作成したものではありません。</p>
    </div>
    <div class="card">
      <h3>このアプリについて</h3>
      <p>道の駅スタンプ帳 v${APP_VERSION}</p>
      <p class="note">記録はこの端末のブラウザ内だけに保存され、外部には送信されません。</p>
    </div>
  `;
}

/* ---------- 起動 ---------- */
async function boot() {
  initListControls();
  document.querySelector('nav.tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) go('/' + b.dataset.tab);
  });
  $('#backBtn').onclick = back;
  document.addEventListener('click', e => {
    const item = e.target.closest('[data-id]');
    if (item && item.classList.contains('item')) { go('/place/' + encodeURIComponent(item.dataset.id)); return; }
    const vb = e.target.closest('[data-visit]');
    if (vb) go('/visit/' + encodeURIComponent(vb.dataset.visit));
  });

  await db.open();
  const [places, visits] = await Promise.all([db.all('places'), db.all('visits')]);
  places.forEach(p => state.places.set(p.id, p));
  state.visits = visits;
  reindexVisits();
  window.addEventListener('hashchange', route);
  route();

  const changed = await syncImportData();
  if (changed || currentView === 'list') route();

  // iOS などでストレージが消されにくくなるよう永続化を要求
  if (navigator.storage?.persist) navigator.storage.persisted().then(ok => ok || navigator.storage.persist()).catch(() => {});
}
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('afterbegin', `<div class="banner">起動に失敗しました：${esc(e.message || e)}</div>`); });
</script>
</body>
</html>
