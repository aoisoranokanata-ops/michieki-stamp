          <button data-act="up" aria-label="上へ"${i === 0 ? ' disabled' : ''}>↑</button>
          <button data-act="down" aria-label="下へ"${i === state.ratingItems.length - 1 ? ' disabled' : ''}>↓</button>
          <button data-act="toggle">${it.hidden ? '表示' : '隠す'}</button>
          <button data-act="del" aria-label="削除">✕</button>
        </li>`).join('')}</ul>
      <div class="ri-add"><input type="text" id="riNew" placeholder="新しい項目（例：トイレ）"><button class="btn" id="riAddBtn">追加</button></div>
    </div>
    <div class="card">
      <h3>データ</h3>
      <p>道の駅：取り込み ${(meta?.count ?? 0).toLocaleString()} 駅（データ版 ${esc(meta?.value || '—')}）</p>
      <p>手動追加 ${manual}・編集済み ${edited}${missing ? `・最新の公式一覧に無い駅 ${missing}` : ''}</p>
      <p class="note">データを更新しても、手動追加・編集した駅は上書き・削除されません。</p>
      <p>訪問記録：${state.visits.length} 件・スタンプ写真：${state.stamps.length} 枚</p>
      <p>保存領域：${persisted === null ? '確認できません' : persisted ? '永続化済み（ブラウザに消されにくい状態）' : '未永続化（ホーム画面に追加すると消えにくくなります）'}${est ? `・使用量 約${(est.usage / 1048576).toFixed(1)}MB` : ''}</p>
    </div>
    <div class="card">
      <h3>データの出典と利用条件</h3>
      <p>同梱の道の駅データは <a href="https://opendatacommons.org/licenses/odbl/1-0/" target="_blank" rel="noopener">Open Database License (ODbL) 1.0</a> で提供しています（アプリのコードは MIT License）。</p>
      <p><b>駅名・よみ・所在地・登録回・登録年月・公式サイト</b>：<a href="https://www.mlit.go.jp/road/Michi-no-Eki/list.html" target="_blank" rel="noopener">国土交通省「道の駅」一覧</a>を加工して作成（<a href="https://www.mlit.go.jp/link.html" target="_blank" rel="noopener">公共データ利用規約 第1.0版</a>）。Excel 一覧から項目を抽出し、ふりがなをひらがなに変換して JSON にしました。</p>
      <p><b>位置</b>：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors（ODbL 1.0）。名称に「道の駅」を含む地物を駅名・市町村で照合しました。照合できなかった駅には位置を含めていません。</p>

      <p class="note">使用ライブラリ：Leaflet 1.9.4（BSD-2-Clause）、JSZip 3.10.1（MIT）。アイコンの文字は BIZ UD明朝（SIL Open Font License）。</p>
      <p class="note">記録はこの端末のブラウザ内だけに保存され、外部には送信されません。</p>

    await saveRatingItems(); toast('名前を変えました');

    const b = e.target.closest('button'); if (!b) return;
    const i = +b.closest('li').dataset.i, items = state.ratingItems;
    if (b.dataset.act === 'up' && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
    else if (b.dataset.act === 'down' && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
    else if (b.dataset.act === 'toggle') items[i].hidden = !items[i].hidden;
    else if (b.dataset.act === 'del') {
      if (!confirm(`「${items[i].label}」を削除しますか？\n過去の記録の値は残りますが、表示されなくなります。`)) return;

  });

    const label = $('#riNew').value.trim();

    rerender();
  };
}

/* ---------- 起動 ---------- */
async function boot() {
  initListControls();
  document.querySelector('nav.tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) go('/' + b.dataset.tab);
  });
  $('#backBtn').onclick = back;
  document.addEventListener('click', e => {
    const item = e.target.closest('[data-id]');
    if (item && item.classList.contains('item')) { go('/place/' + encodeURIComponent(item.dataset.id)); return; }
    const sb = e.target.closest('[data-stamp]');
    if (sb) { go('/stamp/' + encodeURIComponent(sb.dataset.stamp)); return; }
    const vb = e.target.closest('[data-visit]');
    if (vb) go('/visit/' + encodeURIComponent(vb.dataset.visit));
  });

  await db.open();
  await loadRatingItems();
  state.lastBackup = await db.get('meta', 'lastBackup') || null;
  const flash = ls.get('flash', ''); if (flash) { ls.set('flash', ''); setTimeout(() => toast(flash), 300); }
  const [places, visits, stamps] = await Promise.all([db.all('places'), db.all('visits'), db.all('stamps')]);
  state.stamps = stamps;
  state.stampKind = ls.get('stampKind', '');
  state.recordTab = ls.get('recordTab', 'stats');
  state.statsSort = ls.get('statsSort', 'pref');
  places.forEach(p => state.places.set(p.id, p));
  state.visits = visits;
  reindexVisits();
  window.addEventListener('hashchange', route);
  route();

  const changed = await syncImportData();
  if (changed || currentView === 'list') route();

  registerSW();
  // iOS などでストレージが消されにくくなるよう永続化を要求
  if (navigator.storage?.persist) navigator.storage.persisted().then(ok => ok || navigator.storage.persist()).catch(() => {});
}
boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('afterbegin', `<div class="banner">起動に失敗しました：${esc(e.message || e)}</div>`); });
</script>
