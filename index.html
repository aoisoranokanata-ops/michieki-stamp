<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="道の駅スタンプ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>道の駅スタンプ帳</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/jszip/jszip.min.js"></script>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface2: #eeece6; --text: #1f2421; --muted: #6b716d;
  --line: #dcd9d0; --accent: #2f6f4f; --accent-ink: #ffffff; --accent-soft: #dcebe2;
  --stamp: #b5442c; --stamp-soft: #f5e1dc; --star: #e0a21a; --danger: #b3261e;
  --radius: 14px; --tap: 48px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151816; --surface: #1f2421; --surface2: #2a302c; --text: #e9ece8; --muted: #9aa39d;
    --line: #353c37; --accent: #6cbf91; --accent-ink: #0f1a14; --accent-soft: #23382c;
    --stamp: #e8826c; --stamp-soft: #3b2722; --star: #f0b93a; --danger: #ef7b72;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  padding-bottom: calc(68px + var(--safe-b));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

header.top {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: calc(10px + var(--safe-t)) 16px 8px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; min-height: 56px;
}
header.top h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  min-width: var(--tap); height: 40px; border: 0; background: transparent; border-radius: 10px;
  font-size: 15px; color: var(--accent); padding: 0 8px; font-weight: 600;
}
.icon-btn:active { background: var(--surface2); }

main { max-width: 720px; margin: 0 auto; }
.view { display: none; padding: 12px 16px 24px; }
.view.active { display: block; }

nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex;
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
}
nav.tabs button {
  flex: 1; height: 60px; border: 0; background: transparent; color: var(--muted);
  font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
nav.tabs button .ico { font-size: 22px; line-height: 1; }
nav.tabs button.on { color: var(--accent); font-weight: 700; }

/* 検索・絞り込み */
.search { position: relative; margin-bottom: 10px; }
.search input {
  width: 100%; height: var(--tap); border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 40px 0 14px; font-size: 16px;
}
.search .clear { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 18px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters select {
  height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 12px; font-size: 15px; flex: 0 0 auto; max-width: 70vw;
}
.filters select.set { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.count-line { color: var(--muted); font-size: 13px; margin: 6px 2px 8px; display: flex; justify-content: space-between; }

/* 一覧 */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  background: var(--surface); border-radius: var(--radius); padding: 12px 14px; min-height: 64px;
  display: flex; align-items: center; gap: 12px; border: 1px solid transparent; width: 100%; text-align: left;
}
.item:active { background: var(--surface2); }
.item .main { flex: 1; min-width: 0; }
.item .name { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; gap: 4px; flex: 0 0 auto; }
.badge {
  font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.badge.v { background: var(--accent-soft); color: var(--accent); }
.badge.s { background: var(--stamp-soft); color: var(--stamp); }
.badge.n { background: var(--surface2); color: var(--muted); }
.more { width: 100%; height: var(--tap); margin-top: 10px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

/* 詳細 */
.card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.place-head h2 { margin: 0; font-size: 22px; line-height: 1.3; }
.place-head .kana { color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 10px; font-size: 14px; margin-top: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--muted); }
.status-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.section-title { font-size: 14px; color: var(--muted); font-weight: 700; margin: 18px 2px 8px; display: flex; justify-content: space-between; align-items: center; }

.btn {
  height: var(--tap); border-radius: 12px; border: 0; padding: 0 18px; font-weight: 700; font-size: 16px;
  background: var(--accent); color: var(--accent-ink); width: 100%;
}
.btn.ghost { background: var(--surface2); color: var(--text); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn:active { filter: brightness(.92); }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }

.visit {
  background: var(--surface); border-radius: var(--radius); padding: 12px 14px; width: 100%;
  border: 0; text-align: left; display: block;
}
.visit:active { background: var(--surface2); }
.visit .top-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.visit .date { font-weight: 700; }
.visit .text { margin-top: 4px; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.visit .place { font-size: 13px; color: var(--accent); font-weight: 700; }
.stars-inline { color: var(--star); letter-spacing: 1px; font-size: 14px; }

/* フォーム */
.field { margin-bottom: 16px; }
.field > label, .field > .label { display: block; font-size: 14px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.field input[type=text], .field input[type=date], .field select, .field textarea {
  width: 100%; min-height: var(--tap); border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); padding: 10px 12px; font-size: 16px;
}
.field textarea { min-height: 110px; resize: vertical; }
.toggle-row { display: flex; gap: 10px; }
.toggle {
  flex: 1; min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface);
  font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px;
}
.toggle[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.toggle.stamp[aria-pressed=true] { border-color: var(--stamp); background: var(--stamp-soft); color: var(--stamp); }
.stars { display: flex; gap: 2px; }
.stars button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 30px; color: var(--line); padding: 0; line-height: 1; }
.stars button.on { color: var(--star); }
.stars.small button { width: 36px; height: 36px; font-size: 24px; }
.detail-ratings { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 12px; }
.detail-ratings span { font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.banner { background: var(--stamp-soft); color: var(--stamp); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
.settings p { margin: 6px 0; font-size: 14px; }
/* 地図。Leaflet 内部の z-index がヘッダー・タブより前に出ないよう、地図ごとに重なりを閉じ込める */
.leaflet-container { position: relative; z-index: 0; font: inherit; background: var(--surface2); }
.pin-map { height: 260px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.mini-map { height: 190px; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.pin-bar { display: flex; gap: 8px; margin-top: 8px; }
.pin-bar .btn { font-size: 15px; padding: 0 10px; }
#v-map { padding: 0; }
.big-map { height: calc(100vh - 56px - 60px - 34px - var(--safe-t) - var(--safe-b)); height: calc(100dvh - 56px - 60px - 34px - var(--safe-t) - var(--safe-b)); }
.map-info { height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.map-info .legend { flex: 0 0 auto; }
.map-locate { width: 44px; height: 44px; font-size: 22px; background: #fff; border: 2px solid rgba(0,0,0,.2); border-radius: 8px; color: #222; }
.leaflet-popup-content { font-size: 14px; line-height: 1.5; margin: 10px 14px; }
.leaflet-popup-content b { font-size: 15px; }
.here-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin: -4px 2px 8px; }
.here-line button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; height: 32px; padding: 0 12px; font-size: 13px; color: var(--accent); font-weight: 700; }
.dist { color: var(--accent); font-weight: 700; }
.type-chips { margin-bottom: 10px; }
.type-chips .chip[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.st-results { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.st-results button { text-align: left; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 12px; line-height: 1.35; }
.st-results .op { display: block; font-size: 12px; color: var(--muted); }
.banner.warn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.banner.warn span { flex: 1 1 180px; }
.banner.warn button { border: 0; border-radius: 16px; height: 34px; padding: 0 12px; font-weight: 700; background: var(--stamp); color: #fff; }
.banner.warn button.later { background: transparent; color: var(--stamp); }
.bk-box { background: var(--surface2); border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 14px; }
.bk-box .btn-row { margin-top: 10px; }
.bk-box label { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; }
.bk-box input[type=radio] { margin-top: 4px; width: 20px; height: 20px; flex: 0 0 auto; }
.update-bar { position: fixed; left: 12px; right: 12px; bottom: calc(70px + var(--safe-b)); z-index: 40; display: flex; align-items: center; gap: 10px;
  background: var(--text); color: var(--bg); border-radius: 14px; padding: 10px 12px 10px 16px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.update-bar span { flex: 1; }
.update-bar button { border: 0; border-radius: 10px; height: 38px; padding: 0 14px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.update-bar button.close { background: transparent; color: var(--bg); padding: 0 6px; font-size: 18px; }
.stat-big { display: flex; align-items: baseline; gap: 6px; }
.stat-big b { font-size: 34px; line-height: 1.1; }
.stat-big span { color: var(--muted); }
.bar { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.s { background: var(--stamp); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
.stat-grid div { background: var(--surface2); border-radius: 10px; padding: 8px 4px; }
.stat-grid b { display: block; font-size: 20px; }
.stat-grid span { font-size: 12px; color: var(--muted); }
.pref-rows { display: flex; flex-direction: column; gap: 2px; }
.pref-row { display: grid; grid-template-columns: 4.6em 1fr 5.2em; align-items: center; gap: 8px; border: 0; background: transparent; padding: 7px 2px; text-align: left; border-radius: 8px; font-size: 14px; }
.pref-row:active { background: var(--surface2); }
.pref-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.pref-row.done .nm::after { content: ' ★'; color: var(--star); }
.year-rows { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 14px; }
.install-steps { margin: 6px 0 0; padding-left: 1.4em; font-size: 14px; }
.install-steps li { margin: 4px 0; }
.sr-file { position: fixed; left: -1000px; top: 0; width: 1px; height: 1px; opacity: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.chip[aria-pressed=true] { background: var(--stamp-soft); color: var(--stamp); border-color: var(--stamp); font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.tile { position: relative; border: 0; padding: 0; background: var(--surface2); border-radius: 10px; overflow: hidden; aspect-ratio: 1; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px; font-size: 11px; color: #fff; text-align: left;
  background: linear-gradient(transparent, rgba(0,0,0,.65)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .kind { position: absolute; top: 4px; left: 4px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.add-tile { border: 2px dashed var(--line); background: transparent; color: var(--muted); border-radius: 10px; aspect-ratio: 1; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.add-tile .plus { font-size: 26px; line-height: 1; }
.photo-view { width: 100%; border-radius: var(--radius); display: block; background: var(--surface2); }
.photo-busy { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; color: var(--muted); background: var(--surface2); border-radius: var(--radius); }
.picker-results { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.picker-results button { text-align: left; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 12px; }
.picked { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.picked .nm { flex: 1; font-weight: 700; }
.picked button { border: 0; background: transparent; color: var(--accent); font-weight: 700; min-height: 40px; }
.ri-list { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ri { display: flex; gap: 4px; align-items: center; }
.ri input { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 10px; font-size: 16px; }
.ri button { height: 44px; min-width: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); font-size: 14px; padding: 0 8px; }
.ri button:disabled { opacity: .35; }
.ri.off input { color: var(--muted); text-decoration: line-through; }
.ri-add { display: flex; gap: 8px; }
.ri-add input { flex: 1; min-width: 0; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 12px; font-size: 16px; }
.ri-add .btn { width: auto; }
.settings h3 { font-size: 15px; margin: 0 0 8px; }
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="backBtn" hidden aria-label="戻る">‹ 戻る</button>
  <h1 id="title">道の駅スタンプ帳</h1>
  <button class="icon-btn" id="headAction" hidden></button>
</header>

<main>
  <!-- 一覧 -->
  <section class="view" id="v-list">
    <div id="loadBanner"></div>
    <div id="backupBanner"></div>
    <div id="installBanner"></div>
    <div class="chips type-chips" id="typeChips"></div>
    <div class="search">
      <input id="q" type="search" placeholder="名前・よみ・市町村で検索" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qClear" aria-label="検索語を消す" hidden>✕</button>
    </div>
    <div class="filters">
      <select id="fPref" aria-label="都道府県"><option value="">全国</option></select>
      <select id="fVisit" aria-label="訪問状況">
        <option value="">訪問：すべて</option><option value="yes">訪問済み</option><option value="no">未訪問</option>
      </select>
      <select id="fStamp" aria-label="スタンプ">
        <option value="">スタンプ：すべて</option><option value="yes">スタンプあり</option><option value="no">スタンプなし</option>
      </select>
      <select id="fSort" aria-label="並び順">
        <option value="reg">都道府県順</option><option value="near">現在地から近い順</option><option value="kana">よみ順</option><option value="recent">最近の訪問順</option>
      </select>
    </div>
    <div class="count-line"><span id="countText"></span><span id="progressText"></span></div>
    <div class="here-line" id="hereLine" hidden></div>
    <ul class="list" id="list"></ul>
    <button class="more" id="moreBtn" hidden>もっと表示</button>
  </section>

  <!-- 場所の詳細 -->
  <section class="view" id="v-place"></section>

  <!-- 訪問記録フォーム -->
  <section class="view" id="v-visit"></section>

  <!-- 場所の手動追加・編集 -->
  <section class="view" id="v-placeEdit"></section>

  <!-- 訪問記録一覧 -->
  <section class="view" id="v-visits">
    <div class="chips type-chips" id="recordChips"></div>
    <div id="statsBox"></div>
    <ul class="list" id="visitList"></ul>
  </section>

  <!-- 地図 -->
  <section class="view" id="v-map">
    <div class="map-info" id="mapInfo"></div>
    <div id="bigMap" class="big-map"></div>
  </section>

  <!-- スタンプ帳 -->
  <section class="view" id="v-stamps">
    <div class="chips" id="kindChips"></div>
    <div class="count-line"><span id="stampCount"></span></div>
    <div class="grid" id="stampGrid"></div>
  </section>

  <!-- スタンプ写真の登録・編集 -->
  <section class="view" id="v-stamp"></section>

  <!-- 設定・情報 -->
  <section class="view settings" id="v-settings"></section>
</main>

<nav class="tabs">
  <button data-tab="list"><span class="ico">🏠</span>道の駅</button>
  <button data-tab="map"><span class="ico">🗺️</span>地図</button>
  <button data-tab="stamps"><span class="ico">📮</span>スタンプ帳</button>
  <button data-tab="visits"><span class="ico">📊</span>記録</button>
  <button data-tab="settings"><span class="ico">⚙️</span>設定</button>
</nav>
<div class="toast" id="toast"></div>
<div class="update-bar" id="updateBar" hidden><span>新しい版があります</span><button id="updateBtn">読み込み直す</button><button id="updateClose" class="close" aria-label="閉じる">✕</button></div>
<!-- iOS では display:none の input を click() すると開かない版があるため、見えない状態で置いておく -->
<input type="file" id="photoInput" accept="image/*" class="sr-file" tabindex="-1" aria-hidden="true">
<input type="file" id="zipInput" accept=".zip,application/zip,application/x-zip-compressed" class="sr-file" tabindex="-1" aria-hidden="true">

<script>
'use strict';
const APP_VERSION = '0.6.2';   // sw.js の VERSION とそろえる
const APP_KEY = 'michieki-stamp';           // DB名・localStorageキーの接頭辞（github.io は他アプリと同一オリジン）
const DATA_URL = 'data/michinoeki.json';

function distKm(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const ls = {

};

/* ---------- IndexedDB ---------- */
// v1 で後続フェーズのストアまで作っておく（スキーマ移行を減らすため）
const db = {
  conn: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(APP_KEY, 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        const places = d.createObjectStore('places', { keyPath: 'id' });
        places.createIndex('type', 'type');
        places.createIndex('prefecture', 'prefecture');
        const visits = d.createObjectStore('visits', { keyPath: 'id' });
        visits.createIndex('placeId', 'placeId');
        visits.createIndex('visitedDate', 'visitedDate');
        const stamps = d.createObjectStore('stamps', { keyPath: 'id' });
        stamps.createIndex('placeId', 'placeId');
        stamps.createIndex('visitId', 'visitId');
        stamps.createIndex('kind', 'kind');
        d.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = () => { this.conn = req.result; resolve(); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => toast('別のタブでアプリを開いていると更新できません');
    });
  },
  tx(stores, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = this.conn.transaction(stores, mode);
      let result;
      Promise.resolve(fn(t)).then(r => { result = r; });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  },
  all(store) {
    return this.tx([store], 'readonly', t => new Promise(r => { const q = t.objectStore(store).getAll(); q.onsuccess = () => r(q.result); }));
  },
  get(store, key) {
    return this.tx([store], 'readonly', t => new Promise(r => { const q = t.objectStore(store).get(key); q.onsuccess = () => r(q.result); }));
  },
  put(store, val) { return this.tx([store], 'readwrite', t => { t.objectStore(store).put(val); }); },
  del(store, key) { return this.tx([store], 'readwrite', t => { t.objectStore(store).delete(key); }); },
};

/* 評価項目。記録側は [{key, label, value}] の配列で持ち、表示名は key で設定から引く（改名・削除しても過去の値は壊れない） */
async function loadRatingItems() {
  const m = await db.get('meta', 'ratingItems');
  state.ratingItems = m?.items?.length ? m.items : DEFAULT_RATING_ITEMS.map(i => ({ ...i }));
}
function saveRatingItems() { return db.put('meta', { key: 'ratingItems', items: state.ratingItems }); }
function detailsArray(v) {
  const d = v.ratingDetails;
  if (Array.isArray(d)) return d;
  if (d && typeof d === 'object') {   // 初期の試作版 {food: 4} 形式を読み替える
    return Object.entries(d).map(([key, value]) => ({ key, label: DEFAULT_RATING_ITEMS.find(i => i.key === key)?.label || key, value }));
  }
  return [];
}
function ratingLabel(d) { return state.ratingItems.find(i => i.key === d.key)?.label || d.label || d.key; }
const isActive = p => p.status !== 'closed';

function reindexVisits() {
  state.byPlace = new Map();
  const slot = id => {
    let s = state.byPlace.get(id);
    if (!s) state.byPlace.set(id, s = { visits: [], stamps: [], visited: false, stamp: false, last: '' });
    return s;
  };
  // スタンプ写真がある場所は「スタンプあり」とみなす
  for (const st of state.stamps) if (st.placeId) { const s = slot(st.placeId); s.stamps.push(st); s.stamp = true; }
  for (const v of state.visits) {
    const s = slot(v.placeId);
    s.visits.push(v);
    if (v.visited) s.visited = true;
    if (v.stampObtained) s.stamp = true;
    if (v.visitedDate > s.last) s.last = v.visitedDate;
  }
  for (const s of state.byPlace.values()) s.stamps.sort((a, b) => b.takenDate.localeCompare(a.takenDate) || b.createdAt - a.createdAt);
  for (const s of state.byPlace.values()) s.visits.sort((a, b) => b.visitedDate.localeCompare(a.visitedDate) || b.createdAt - a.createdAt);
}

function searchKey(p) {
  return normQ(`${placeTitle(p)} ${p.nameKana || ''} ${p.address || ''} ${p.operator || ''} ${p.line || ''}`);
}

/* ---------- 道の駅データの取り込み ---------- */
// 同梱 JSON の版が変わったら取り込み直す。
//  - 新しい駅は追加する
//  - 利用者が手動追加・編集した駅（source:'manual' / edited:true）は一切上書き・削除しない
//  - 手を入れていない取り込み駅だけ、最新データ（よみ・位置など）で更新する
//  - 一覧から消えた駅は削除せず missingFromSource の印だけ付ける（記録が紐づいている可能性があるため）
async function syncImportData() {
  let data;
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    if (state.places.size === 0) $('#loadBanner').innerHTML = '<div class="banner">道の駅データを読み込めませんでした。通信できる場所でもう一度開いてください。</div>';
    return false;
  }
  const meta = await db.get('meta', 'dataVersion');
  if (meta && meta.value === data.version && state.places.size > 0) return false;

  // 手動追加済みの駅が後から公式一覧に載った場合、二重登録にしない（同じ都道府県・同じ名前なら同一とみなす）
  const manualByName = new Map(), linked = new Set();
  for (const p of state.places.values()) {
    if (p.source !== 'manual' || p.type !== 'michinoeki') continue;
    manualByName.set(p.prefecture + '|' + normQ(p.name), p);
    if (p.importId) linked.add(p.importId);
  }
  const incoming = new Set();
  await db.tx(['places'], 'readwrite', t => {
    const store = t.objectStore('places');
    data.places.forEach((r, ord) => {
      incoming.add(r.id);
      const pref = data.prefs[r.pref - 1];
      const old = state.places.get(r.id);
      if (old && (old.edited || old.source === 'manual')) {
        if (old.missingFromSource) { old.missingFromSource = false; store.put(old); }
        return;
      }
      if (!old) {
        if (linked.has(r.id)) return;
        const m = manualByName.get(pref + '|' + normQ(r.name));
        if (m) { m.importId = r.id; store.put(m); return; }
      }
      const p = {
        status: 'open', regNo: '', createdAt: Date.now(), ...(old || {}),
        id: r.id, type: 'michinoeki', source: 'import', edited: false, missingFromSource: false, ord,
        name: r.name, nameKana: r.kana, prefecture: pref, address: r.addr,
        regRound: r.round, regDate: (r.reg || '').trim(), url: r.url || '',
        lat: r.lat ?? null, lng: r.lng ?? null, geoPrecision: r.prec,
      };
      delete p._k;
      store.put(p);
      state.places.set(p.id, p);
    });
    for (const p of state.places.values()) {
      if (p.source === 'import' && !incoming.has(p.id) && !p.missingFromSource) {
        p.missingFromSource = true; store.put(p);
      }
    }
  });
  await db.put('meta', { key: 'dataVersion', value: data.version, count: data.count, sources: data.sources });
  return true;
}

// #/list, #/place/<id>, #/visit/new/<placeId>, #/visit/<id>, #/place-new, #/place-edit/<id>, #/visits, #/settings
const scrollPos = {};
let currentView = null;

function go(hash) { location.hash = hash; }

function showView(name, title, { back = false, action = null } = {}) {
  if (currentView) scrollPos[currentView] = window.scrollY;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + name));
  $('#title').textContent = title;
  $('#backBtn').hidden = !back;
  const ha = $('#headAction');
  ha.hidden = !action;
  if (action) { ha.textContent = action.label; ha.onclick = action.fn; }
  const tab = { list: 'list', place: 'list', placeEdit: 'list', visit: 'list', visits: 'visits', settings: 'settings', stamps: 'stamps', stamp: 'stamps', map: 'map' }[name];
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const prev = currentView;
  currentView = name;
  // 一覧に戻ったときはスクロール位置を復元、それ以外は先頭へ
  requestAnimationFrame(() => window.scrollTo(0, ['list', 'visits', 'stamps'].includes(name) && prev !== name ? (scrollPos[name] || 0) : 0));
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/list');
  const parts = h.split('/').filter(Boolean);
  const [a, b, ...rest] = parts;
  if (a === 'place' && b) return renderPlace([b, ...rest].join('/'));
  if (a === 'visit' && b === 'new') return renderVisitForm(null, rest.join('/'));
  if (a === 'visit' && b) return renderVisitForm(b);
  if (a === 'place-new') return renderPlaceEdit(null);
  if (a === 'place-edit' && b) return renderPlaceEdit([b, ...rest].join('/'));
  if (a === 'visits') { renderVisits(); return showView('visits', '記録・統計'); }
  if (a === 'stamps') { renderStamps(); return showView('stamps', 'スタンプ帳', { action: { label: '＋追加', fn: () => pickPhoto({}) } }); }
  if (a === 'stamp-new') return renderStampEdit(null);
  if (a === 'map') return renderMapView();
  if (a === 'stamp' && b) return renderStampEdit(b);
  if (a === 'settings') { renderSettings(); return showView('settings', '設定・情報'); }
  renderList();
  showView('list', '道の駅スタンプ帳', { action: { label: '＋追加', fn: () => go('/place-new') } });
}

function renderTypeChips() {
  $('#typeChips').innerHTML = Object.entries(LIST_GROUPS).map(([k, l]) => `<button class="chip" data-type="${k}" aria-pressed="${filters.type === k}">${l}</button>`).join('');

  $('#fSort').addEventListener('change', () => { if (filters.sort === 'near' && !state.here) refreshHere(); });

}
function onFilter() { state.listLimit = 80; ls.set('filters', filters); renderList(); window.scrollTo(0, 0); }

function filteredPlaces() {
  const q = normQ(filters.q);
  let arr = [];
  for (const p of state.places.values()) {
    if (groupOf(p) !== filters.type) continue;
    if (filters.pref && p.prefecture !== filters.pref) continue;
    const s = state.byPlace.get(p.id);
    if (filters.visit === 'yes' && !s?.visited) continue;
    if (filters.visit === 'no' && s?.visited) continue;
    if (filters.stamp === 'yes' && !s?.stamp) continue;
    if (filters.stamp === 'no' && s?.stamp) continue;
    if (q) { p._k ??= searchKey(p); if (!p._k.includes(q)) continue; }
    arr.push(p);
  }
  const prefIdx = p => PREFS.indexOf(p.prefecture);
  if (filters.sort === 'near' && state.here) {
    // 位置の無い駅は最後に回す
    for (const p of arr) p._d = p.lat != null ? distKm(state.here, p) : Infinity;
    arr.sort((a, b) => a._d - b._d || prefIdx(a) - prefIdx(b));
  } else if (filters.sort === 'kana') arr.sort((a, b) => (a.nameKana || a.name).localeCompare(b.nameKana || b.name, 'ja'));
  else if (filters.sort === 'recent') arr.sort((a, b) => (state.byPlace.get(b.id)?.last || '').localeCompare(state.byPlace.get(a.id)?.last || '') || prefIdx(a) - prefIdx(b));
  else arr.sort((a, b) => prefIdx(a) - prefIdx(b) || (a.ord ?? 1e9) - (b.ord ?? 1e9) || a.name.localeCompare(b.name, 'ja'));
  return arr;
}

function badgesHtml(p) {
  const s = state.byPlace.get(p.id);
  let h = '';
  if (p.status && p.status !== 'open') h += `<span class="badge n">${STATUS_LABEL[p.status]}</span>`;
  if (s?.stamp) h += '<span class="badge s">スタンプ</span>';
  if (s?.visited) h += `<span class="badge v">訪問${s.visits.filter(v => v.visited).length > 1 ? '×' + s.visits.filter(v => v.visited).length : ''}</span>`;
  return h;
}

function placeSub(p) {
  if (p.type === 'station') return [p.operator, p.line, p.prefecture].filter(Boolean).join('・');
  if (p.type !== 'michinoeki') return [PLACE_TYPE_LABEL[p.type], p.address || p.prefecture].filter(Boolean).join('・');
  return p.address || p.prefecture || '';
}
function renderList() {
  for (const el of ['#fPref', '#fVisit', '#fStamp']) $(el).classList.toggle('set', !!$(el).value);
  $('#qClear').hidden = !filters.q;
  const arr = filteredPlaces();
  const total = [...state.places.values()].filter(p => groupOf(p) === filters.type && isActive(p));
  const visited = total.filter(p => state.byPlace.get(p.id)?.visited).length;
  $('#countText').textContent = `${arr.length.toLocaleString()} 件`;
  // 道の駅は全駅に対する達成状況、駅・記念は登録したものの訪問数
  $('#progressText').textContent = filters.type === 'michinoeki' ? (total.length ? `訪問 ${visited} / ${total.length}` : '') : `登録 ${total.length}・訪問 ${visited}`;
  const shown = arr.slice(0, state.listLimit);
  $('#list').innerHTML = shown.length ? shown.map(p => `
    <li><button class="item" data-id="${esc(p.id)}">
      <div class="main">
        <div class="name">${esc(placeTitle(p))}</div>
        <div class="sub">${state.here && p.lat != null ? `<span class="dist">${fmtKm(distKm(state.here, p))}</span>・` : ''}${esc(placeSub(p))}${p.type === 'michinoeki' ? (p.source === 'manual' ? '・手動追加' : p.edited ? '・編集済み' : '') : ''}</div>
      </div>
      <div class="badges">${badgesHtml(p)}</div>
    </button></li>`).join('')
    : `<li class="empty">${!state.places.size ? '読み込み中…'
        : filters.type !== 'michinoeki' && !total.length ? `${LIST_GROUPS[filters.type]}はまだ登録されていません。<br>右上の「＋追加」から登録できます。`
        : '条件に合う場所がありません'}</li>`;
  renderHereLine();
  renderBackupBanner();
  renderInstallBanner();
  $('#moreBtn').hidden = arr.length <= state.listLimit;
  $('#moreBtn').textContent = `もっと表示（残り ${(arr.length - state.listLimit).toLocaleString()} 件）`;
}

/* ---------- 場所の詳細 ---------- */
function renderPlace(id) {
  const p = state.places.get(id);
  if (!p) { go('/list'); return; }
  const s = state.byPlace.get(id);
  const visits = s?.visits || [];

function visitItemHtml(v, withPlace = false) {
  const p = withPlace ? state.places.get(v.placeId) : null;
  const text = [v.impression, v.memo].filter(Boolean).join(' / ');
  const order = new Map(state.ratingItems.filter(i => !i.hidden).map((i, n) => [i.key, n]));
  const det = detailsArray(v).filter(d => d.value && order.has(d.key)).sort((a, b) => order.get(a.key) - order.get(b.key));
  return `<li><button class="visit" data-visit="${esc(v.id)}">
    ${p ? `<div class="place">${esc(placeTitle(p))}<span class="note">　${esc(p.prefecture || '')}</span></div>` : ''}
    <div class="top-line">
      <span class="date">${fmtDate(v.visitedDate)}</span>
      ${v.visited ? '' : '<span class="badge n">未入場</span>'}
      ${v.stampObtained ? '<span class="badge s">スタンプ</span>' : ''}
      <span class="stars-inline">${starsText(v.ratingOverall)}</span>
    </div>
    ${det.length ? `<div class="note">${det.map(d => `${esc(ratingLabel(d))}★${d.value}`).join('　')}</div>` : ''}
    ${text ? `<div class="text">${esc(text)}</div>` : ''}
  </button></li>`;
}

/* ---------- 訪問記録フォーム ---------- */
function starPicker(name, value, small = false) {
  return `<div class="stars${small ? ' small' : ''}" data-stars="${name}" data-value="${value || 0}">
    ${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n <= (value || 0) ? 'on' : ''}" aria-label="${n}">★</button>`).join('')}
  </div>`;
}
function bindStars(root) {
  root.querySelectorAll('.stars').forEach(box => {
    box.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const n = +b.dataset.n;
      const v = +box.dataset.value === n ? 0 : n;   // 同じ星をもう一度押すと解除
      box.dataset.value = v;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= v));
    });
  });
}

      : '<p class="hint">スタンプ写真は、保存したあと道の駅の画面から追加できます。</p>'}
    <div class="btn-row"><button class="btn" id="saveVisit">保存</button></div>
    ${v.id ? '<div class="btn-row"><button class="btn danger" id="delVisit">この記録を削除</button></div>' : ''}
  `;
  for (const id of ['#tVisited', '#tStamp']) {
    $(id, el).onclick = e => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); };
  }
  bindStars(el);
  const avs = $('#addVisitStamp', el);
  if (avs) avs.onclick = () => pickPhoto({ placeId: v.placeId, visitId: v.id });
  $('#saveVisit', el).onclick = async () => {
    const date = $('#fDate', el).value;
    if (!date) { toast('訪問日を入れてください'); return; }
    // 画面に出していない項目（非表示・削除済み）の過去の値はそのまま引き継ぐ
    const shownKeys = new Set(shownItems.map(i => i.key));
    const details = det.filter(d => !shownKeys.has(d.key));
    for (const i of shownItems) {
      const n = +$(`[data-stars="d:${i.key}"]`, el).dataset.value;
      if (n) details.push({ key: i.key, label: i.label, value: n });
    }
    const now = Date.now();
    const rec = {
      ...v, id: v.id || uid(), visitedDate: date,
      visited: $('#tVisited', el).getAttribute('aria-pressed') === 'true',
      stampObtained: $('#tStamp', el).getAttribute('aria-pressed') === 'true',
      ratingOverall: +$('[data-stars="overall"]', el).dataset.value || 0,
      ratingDetails: details,
      impression: $('#fImp', el).value.trim(), memo: $('#fMemo', el).value.trim(),
      createdAt: v.createdAt || now, updatedAt: now,

    await db.put('visits', rec);
    const i = state.visits.findIndex(x => x.id === rec.id);
    if (i >= 0) state.visits[i] = rec; else state.visits.push(rec);
    reindexVisits();
    toast('保存しました');
    back();
  };
  const del = $('#delVisit', el);
  if (del) del.onclick = async () => {
    if (!confirm(`${fmtDate(v.visitedDate)} の記録を削除しますか？${state.stamps.some(x => x.visitId === v.id) ? '\n（スタンプ写真は消えずに残ります）' : ''}`)) return;
    const linked = state.stamps.filter(x => x.visitId === v.id);

      t.objectStore('visits').delete(v.id);

    });
    state.visits = state.visits.filter(x => x.id !== v.id);
    reindexVisits();
    toast('削除しました');
    back();
  };
  showView('visit', v.id ? '訪問記録を編集' : '訪問を記録', { back: true });
}

/* ---------- 場所の手動追加・編集 ---------- */
function parseLatLng(text) {
  const m = String(text).normalize('NFKC').match(/(-?\d+(?:\.\d+)?)\s*[,、\s]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  return lat >= 20 && lat <= 46 && lng >= 122 && lng <= 154 ? { lat, lng } : null;
}

// 国土地理院の住所検索（CORS 可・公式な利用規約の掲載なし・試験運用扱い）。押したときだけ住所を送る
async function geocodeAddress(q) {
  const res = await fetch(GSI_SEARCH + encodeURIComponent(q));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const arr = await res.json();
  if (!arr.length) return null;
  const f = arr[0];
  const title = f.properties.title;
  const rough = !/[0-9０-９]|丁目|番地?|号/.test(title);
  return { lat: +f.geometry.coordinates[1].toFixed(6), lng: +f.geometry.coordinates[0].toFixed(6), title, rough };
}

function findDuplicates(rec) {
  const n = normQ(rec.name);
  const out = [];
  for (const o of state.places.values()) {
    if (o.id === rec.id || o.type !== rec.type) continue;
    if (rec.type === 'station') {
      // 大きな駅は事業者ごとにスタンプが別なので、同名でも事業者・路線が違えば別の駅として扱う
      if (normQ(o.name) === n && (o.operator || '') === (rec.operator || '') && (!rec.line || !o.line || o.line === rec.line))
        out.push(`・${placeTitle(o)}（${[o.operator, o.line].filter(Boolean).join('・')}）`);
      continue;
    }
    if (normQ(o.name) === n) { out.push(`・${o.name}（${o.prefecture}）同じ名前`); continue; }
    if (rec.lat != null && o.lat != null && o.geoPrecision !== 'city') {
      const d = distKm(rec, o);
      if (d < 0.3) out.push(`・${o.name}（${o.prefecture}）約${Math.round(d * 1000)}m`);
    }
  }
  return out;
}

    const name = T === 'michinoeki' ? $('#pName', el).value.trim().replace(/^道の駅\s*/, '')
      : T === 'station' ? $('#pName', el).value.trim().replace(/駅$/, '') : $('#pName', el).value.trim();
    const pref = $('#pPref', el).value;
    if (!name) { toast('名前を入れてください'); return; }
    if (!pref) { toast('都道府県を選んでください'); return; }
    let pos = { lat: null, lng: null };
    if (latlng.value.trim()) {
      pos = parseLatLng(latlng.value);
      if (!pos) { toast('緯度経度の形式が正しくありません'); latlng.focus(); return; }
    }
    const geoChanged = pos.lat !== p.lat || pos.lng !== p.lng;
    const now = Date.now();
    const rec = {
      ...(isNew ? { id: 'u:' + uid(), type: T, source: 'manual', createdAt: now } : p),
      name, nameKana: kataToHira($('#pKana', el).value.trim()), prefecture: pref,
      address: $('#pAddr', el).value.trim(), status: $('#pStatus', el).value,
      url: $('#pUrl', el).value.trim(), lat: pos.lat, lng: pos.lng, updatedAt: now,
    };
    if (T === 'michinoeki') Object.assign(rec, { regNo: $('#pRegNo', el).value.trim(), regRound: $('#pRound', el).value.trim(), regDate: $('#pRegDate', el).value.trim() });
    if (T === 'station') Object.assign(rec, { operator: $('#pOp', el).value.trim(), line: $('#pLine', el).value.trim(), stationRef: stationRef || p.stationRef || null });
    const pt = $('#pType', el); if (pt) rec.type = pt.value;
    if (geoChanged) rec.geoPrecision = pos.lat == null ? null : (geo.precision || 'manual');
    if (!isNew && p.source === 'import') rec.edited = true;
    delete rec._k;
    // 名前か位置を変えたときだけ重複を確かめる（取り込みデータには同名駅が元からあるため）
    if (isNew || name !== p.name || geoChanged) {
      const dup = findDuplicates(rec);
      if (dup.length && !confirm(`似た${T === 'station' ? '駅' : T === 'michinoeki' ? '道の駅' : '場所'}がすでにあります。\n${dup.slice(0, 5).join('\n')}\n\nこのまま保存しますか？`)) return;
    }
    await db.put('places', rec);
    state.places.set(rec.id, rec);
    toast('保存しました');
    if (isNew) location.replace('#/place/' + encodeURIComponent(rec.id)); else back();
  };
  const del = $('#delPlace', el);
  if (del) del.onclick = async () => {
    const n = state.byPlace.get(id)?.visits.length || 0, ns = state.byPlace.get(id)?.stamps.length || 0;
    const extra = [n && `訪問記録 ${n} 件`, ns && `スタンプ写真 ${ns} 枚`].filter(Boolean).join('・');
    const what = T === 'michinoeki' ? 'この道の駅' : `「${placeTitle(p)}」`;
    if (!confirm(extra ? `${what}と、${extra}を削除しますか？` : `${what}を削除しますか？`)) return;
    await db.tx(['places', 'visits', 'stamps'], 'readwrite', t => {
      t.objectStore('places').delete(id);
      for (const v of state.visits) if (v.placeId === id) t.objectStore('visits').delete(v.id);
      for (const st of state.stamps) if (st.placeId === id) t.objectStore('stamps').delete(st.id);
    });
    state.places.delete(id);
    state.visits = state.visits.filter(v => v.placeId !== id);
    state.stamps.filter(st => st.placeId === id).forEach(forgetUrls);
    state.stamps = state.stamps.filter(st => st.placeId !== id);
    reindexVisits();
    toast('削除しました');
    go('/list');
  };
  const typeName = T === 'michinoeki' ? '道の駅' : T === 'station' ? '駅' : '場所';
  showView('placeEdit', `${typeName}を${isNew ? '追加' : '編集'}`, { back: true });
  // 地図は画面を表示してから作る（非表示のまま作ると大きさを測れない）

  });
}

/* ---------- 地図・位置 ---------- */
const fmtKm = d => d < 1 ? `${Math.round(d * 1000)}m` : d < 10 ? `${d.toFixed(1)}km` : `${Math.round(d)}km`;
const round6 = ll => ({ lat: +(+ll.lat).toFixed(6), lng: +(+ll.lng).toFixed(6) });

// 現在地は、利用者の操作（ボタン・並び順の選択）のときだけ取得する。端末外へは送らない
function locate() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('この端末・ブラウザでは現在地を使えません')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => { state.here = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, at: Date.now() }; resolve(state.here); },
      err => reject(new Error(err.code === 1 ? '位置情報の利用が許可されていません。端末の設定でこのサイト（Safari）の位置情報を許可してください。'
        : err.code === 3 ? '現在地の取得に時間がかかりすぎました。屋外などでもう一度お試しください。' : '現在地を取得できませんでした。')),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });
}
async function refreshHere() {
  const line = $('#hereLine');
  line.hidden = false; line.innerHTML = '<span>現在地を取得しています…</span>';
  try { await locate(); }
  catch (e) { toast(e.message); }
  renderList();
}
function renderHereLine() {
  const line = $('#hereLine');
  if (filters.sort !== 'near') { line.hidden = true; return; }
  line.hidden = false;
  line.innerHTML = state.here
    ? `<span>現在地（${new Date(state.here.at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}・誤差 約${fmtKm(state.here.acc / 1000)}）から近い順</span><button id="hereBtn">📍 更新</button>`
    : `<span>現在地がまだありません</span><button id="hereBtn">📍 現在地を取得</button>`;
  $('#hereBtn').onclick = refreshHere;
}

function makeMap(elm, opts = {}) {
  const m = L.map(elm, { zoomControl: true, ...opts });
  m.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  L.tileLayer(TILE_URL, { attribution: TILE_ATTR, minZoom: 5, maxZoom: 18 }).addTo(m);
  // 非表示の画面で作った地図は大きさ0のままになるので、入れ物の大きさが変わったら測り直す
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => m.invalidateSize());
    ro.observe(elm);
    m.on('unload', () => ro.disconnect());
  }
  return m;
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function placeColor(p) {
  const s = state.byPlace.get(p.id);
  return s?.stamp ? cssVar('--stamp') : s?.visited ? cssVar('--accent') : '#8a8f8b';
}

// 地図でピンを指定する部品（タップで置く・ドラッグで動かす・現在地にする・外す）
function pinPicker(container, { value, fallback, onChange, hereLabel = '📍 現在地にする' }) {
  container.innerHTML = `<div class="pin-map"></div>
    <div class="pin-bar"><button type="button" class="btn ghost" data-act="here">${hereLabel}</button><button type="button" class="btn ghost" data-act="clear">ピンを外す</button></div>
    <div class="hint" data-msg>地図をタップするとピンを置けます。ピンは指で動かせます。</div>`;
  const map = makeMap(container.querySelector('.pin-map'));
  const msg = container.querySelector('[data-msg]');
  let marker = null;
  const place = (ll, notify, source) => {
    if (!ll) {
      if (marker) { map.removeLayer(marker); marker = null; }
      if (notify) onChange(null);
      return;
    }
    if (!marker) {
      marker = L.marker(ll, { draggable: true, autoPan: true }).addTo(map);
      marker.on('dragend', () => onChange(round6(marker.getLatLng()), 'pin'));
    } else marker.setLatLng(ll);
    if (notify) onChange(round6(ll), source);
  };
  const start = value || fallback || (state.here && { lat: state.here.lat, lng: state.here.lng });
  if (start) map.setView([start.lat, start.lng], value ? 17 : 15); else map.setView(JAPAN_VIEW.center, JAPAN_VIEW.zoom);
  if (value) place(value, false);
  map.on('click', e => place(e.latlng, true, 'pin'));
  container.querySelector('[data-act="here"]').onclick = async e => {
    const b = e.currentTarget;
    if (b.disabled) return;
    b.disabled = true; msg.textContent = '現在地を取得しています…';
    try {
      const h = await locate();
      place(L.latLng(h.lat, h.lng), true, 'gps');
      map.setView([h.lat, h.lng], 17);
      msg.textContent = `現在地にピンを置きました（誤差 約${fmtKm(h.acc / 1000)}）。必要ならピンを動かして調整してください。`;
    } catch (err) { msg.textContent = err.message; }
    finally { b.disabled = false; }
  };
  container.querySelector('[data-act="clear"]').onclick = () => { place(null, true); msg.textContent = 'ピンを外しました。'; };
  return {
    map,
    show(v) { place(v, false); if (v) map.setView([v.lat, v.lng], Math.max(map.getZoom(), 16)); },  // 外から値を入れる（onChange は呼ばない）
    refresh() { map.invalidateSize(); },
    destroy() { map.remove(); },
  };
}

/* 地図タブ：一覧の絞り込みをそのまま反映して表示する */

/* ---------- 駅データ（駅名の入力補助） ---------- */
// 国土数値情報（鉄道データ）を加工した data/stations.json。駅の追加画面で初めて必要になったときに読み込む
let stationsCache = null;
async function loadStations() {
  if (stationsCache) return stationsCache;
  const res = await fetch(STATIONS_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const d = await res.json();
  stationsCache = { meta: d, rows: d.stations.map(r => ({ name: r[0], operator: d.operators[r[1]], line: d.lines[r[2]], lat: r[3], lng: r[4], kind: r[5], k: normQ(r[0]) })) };
  return stationsCache;
}
// 1語目は駅名（前方一致を優先）、2語目以降は事業者・路線で絞る
function searchStations(data, text) {
  const terms = String(text).normalize('NFKC').trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const head = normQ(terms[0].replace(/駅$/, '')), rest = terms.slice(1).map(normQ);
  const taken = new Set([...state.places.values()].filter(p => p.type === 'station').map(p => `${p.name}|${p.operator}|${p.line}`));
  const hits = [];
  for (const r of data.rows) {
    if (!r.k.includes(head)) continue;
    if (rest.length && !rest.every(t => normQ(r.operator + r.line).includes(t))) continue;
    hits.push(r);
  }
  hits.sort((a, b) => (b.k.startsWith(head) - a.k.startsWith(head)) || (a.k === head ? -1 : b.k === head ? 1 : 0) || a.k.length - b.k.length);
  return hits.slice(0, 12).map(r => ({ ...r, taken: taken.has(`${r.name}|${r.operator}|${r.line}`) }));
}
// 駅データに都道府県は無いので、駅を選んだときに国土地理院の逆ジオコーダで調べる（操作1回につき1リクエスト、
// 送るのは駅の座標だけ）。使えないときは、いちばん近い道の駅の都道府県を候補にする
async function prefFromLatLng(pt) {
  try {
    const res = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${pt.lat}&lon=${pt.lng}`);
    const code = parseInt((await res.json())?.results?.muniCd?.slice(0, 2), 10);
    if (code >= 1 && code <= 47) return { pref: PREFS[code - 1], source: 'gsi' };
  } catch {}
  return { pref: guessPref(pt), source: 'nearest' };
}
function guessPref(pt) {
  let best = null, bd = Infinity;
  for (const p of state.places.values()) {
    if (p.type !== 'michinoeki' || p.lat == null) continue;
    const d = distKm(pt, p);
    if (d < bd) { bd = d; best = p; }
  }
  return best && bd < 60 ? best.prefecture : '';
}

/* ---------- スタンプ写真 ---------- */
// 写真は Canvas で描き直して JPEG にする。縮小と同時に EXIF（撮影位置など）も落ちる
async function loadImage(file) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {}
  }
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('この画像は読み込めません（HEIC などはブラウザによって非対応）')); };
    img.src = url;
  });
}
function drawScaled(src, max, quality) {
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, 0, 0, c.width, c.height);
  return new Promise((resolve, reject) => c.toBlob(b => b ? resolve({ blob: b, width: c.width, height: c.height }) : reject(new Error('画像の変換に失敗しました')), 'image/jpeg', quality));
}
async function processPhoto(file) {
  const img = await loadImage(file);
  try {
    const photo = await drawScaled(img, PHOTO_MAX, 0.85);
    const thumb = await drawScaled(img, THUMB_MAX, 0.8);
    return { photo, thumb };
  } finally { img.close?.(); }
}

// Blob → object URL は使い回し、写真を消したり差し替えたりしたら解放する
const urlCache = new Map();
function blobUrl(st, which) {
  const k = st.id + ':' + which + ':' + (st.updatedAt || 0);
  if (!urlCache.has(k)) urlCache.set(k, URL.createObjectURL(st[which]));
  return urlCache.get(k);
}
function forgetUrls(st) {
  for (const [k, u] of urlCache) if (k.startsWith(st.id + ':')) { URL.revokeObjectURL(u); urlCache.delete(k); }
}

function stampTiles(list, withCaption = true) {

    const p = st.placeId ? state.places.get(st.placeId) : null;

      <img src="${blobUrl(st, 'thumb')}" alt="" loading="lazy" decoding="async">
      ${withCaption ? `<span class="kind">${KIND_LABEL[st.kind] || ''}</span><span class="cap">${esc(placeTitle(p) || st.note || KIND_LABEL[st.kind])}</span>` : ''}
    </button>`;
  }).join('');
}

    const src = processed ? processed.url : st.photo ? blobUrl(st, 'photo') : null;
    el.innerHTML = `
      ${src ? `<img class="photo-view" src="${src}" alt="スタンプ写真">` : '<div class="photo-busy">写真を縮小しています…</div>'}
      <div class="btn-row" style="margin-top:8px"><button class="btn ghost" id="replacePhoto">写真を${isNew ? '選び直す' : '差し替える'}</button></div>
      <div class="field" style="margin-top:16px"><div class="label">種別</div>
        <div class="chips" id="stKind">${Object.entries(KIND_LABEL).map(([k, l]) => `<button type="button" class="chip" data-kind="${k}" aria-pressed="${st.kind === k}">${l}</button>`).join('')}</div>
      </div>
      <div class="field"><div class="label">場所${st.kind === 'memorial' || st.kind === 'other' ? '（任意）' : ''}</div>
        ${place ? `<div class="picked"><span class="nm">${esc(placeTitle(place))}<span class="note">　${esc(place.prefecture || '')}</span></span><button type="button" id="clearPlace">外す</button></div>`
          : `<input type="search" id="placeQ" placeholder="道の駅・駅・登録した場所の名前で探す" autocomplete="off" style="width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:16px">
             <div class="picker-results" id="placeRes"></div>`}
      </div>
      ${place ? `<div class="field"><label for="stVisit">訪問記録との紐づけ</label>
        <select id="stVisit"><option value="">紐づけない</option>${visits.map(v => `<option value="${esc(v.id)}"${v.id === st.visitId ? ' selected' : ''}>${fmtDate(v.visitedDate)}${v.stampObtained ? '' : '（スタンプ未取得の記録）'}</option>`).join('')}</select>
        ${visits.length ? '' : '<div class="hint">この場所の訪問記録はまだありません。</div>'}</div>` : ''}
      <div class="field"><label for="stDate">日付</label><input type="date" id="stDate" value="${esc(st.takenDate)}"></div>
      <div class="field"><label for="stSpot">スタンプの設置場所</label>
        <input type="text" id="stSpot" value="${esc(st.stampSpotNote)}" placeholder="例：館内の観光案内カウンター横">
        <div class="hint" style="margin:8px 0 6px">設置場所のピン（任意）${st.stampSpotLat != null ? `：${st.stampSpotLat.toFixed(5)}, ${st.stampSpotLng.toFixed(5)}` : ''}</div>
        <div id="stPin"></div></div>
      <div class="field"><label for="stNote">メモ</label><textarea id="stNote" placeholder="インクの色・押し方のコツ・記念スタンプの名前など">${esc(st.note)}</textarea></div>
      <div class="btn-row"><button class="btn" id="saveStamp"${isNew && !processed ? ' disabled' : ''}>保存</button></div>
      ${isNew ? '' : '<div class="btn-row"><button class="btn danger" id="delStamp">このスタンプ写真を削除</button></div>'}
    `;
    const keep = () => {   // 再描画の前に入力中の値を拾っておく
      st.takenDate = $('#stDate', el).value || st.takenDate;
      st.stampSpotNote = $('#stSpot', el).value; st.note = $('#stNote', el).value;
      const vs = $('#stVisit', el); if (vs) st.visitId = vs.value || null;
    };
    $('#stKind', el).onclick = e => { const b = e.target.closest('[data-kind]'); if (!b) return; keep(); st.kind = b.dataset.kind; draw(); };
    const cp = $('#clearPlace', el); if (cp) cp.onclick = () => { keep(); st.placeId = null; st.visitId = null; draw(); };
    const q = $('#placeQ', el);
    if (q) q.oninput = () => {
      const n = normQ(q.value);
      const hits = n ? [...state.places.values()].filter(p => (p._k ??= searchKey(p)).includes(n)).slice(0, 8) : [];
      $('#placeRes', el).innerHTML = hits.map(p => `<button type="button" data-pick="${esc(p.id)}">${esc(placeTitle(p))}<span class="note">　${esc(placeSub(p))}</span></button>`).join('');
    };
    const pr = $('#placeRes', el);
    if (pr) pr.onclick = e => {
      const b = e.target.closest('[data-pick]'); if (!b) return;
      keep(); st.placeId = b.dataset.pick;
      const p = state.places.get(st.placeId);
      if (st.kind === 'memorial' || st.kind === 'other') st.kind = p.type || st.kind;
      st.visitId = state.visits.find(v => v.placeId === st.placeId && v.visitedDate === st.takenDate)?.id || null;
      draw();
    };
    $('#replacePhoto', el).onclick = () => {
      keep();
      const inp = $('#photoInput'); inp.value = '';
      inp.onchange = async () => { const f = inp.files && inp.files[0]; if (f) await runProcess(f); };
      inp.click();
    };
    $('#saveStamp', el).onclick = save;
    const del = $('#delStamp', el); if (del) del.onclick = remove;
    if (spotPicker) spotPicker.destroy();
    spotPicker = pinPicker($('#stPin', el), {
      value: st.stampSpotLat != null ? { lat: st.stampSpotLat, lng: st.stampSpotLng } : null,
      fallback: place?.lat != null ? { lat: place.lat, lng: place.lng } : null,
      hereLabel: '📍 ここにある',
      onChange: v => {
        st.stampSpotLat = v ? v.lat : null; st.stampSpotLng = v ? v.lng : null;
        const h = el.querySelector('#stPin').previousElementSibling;
        h.textContent = '設置場所のピン（任意）' + (v ? `：${v.lat.toFixed(5)}, ${v.lng.toFixed(5)}` : '');
      },
    });
    requestAnimationFrame(() => spotPicker && spotPicker.refresh());
  };

  const runProcess = async file => {
    if (processed?.url) URL.revokeObjectURL(processed.url);
    processed = null; draw();
    try {
      processed = await processPhoto(file);
      processed.url = URL.createObjectURL(processed.photo.blob);   // プレビュー用（画面を離れたら不要）
    } catch (e) {
      toast(e.message || '画像を読み込めませんでした');
      if (isNew && !st.photo) { state.pending = null; back(); return; }
    }
    draw();
  };

  const save = async () => {
    st.takenDate = $('#stDate', el).value;
    if (!st.takenDate) { toast('日付を入れてください'); return; }
    st.stampSpotNote = $('#stSpot', el).value.trim(); st.note = $('#stNote', el).value.trim();
    const vs = $('#stVisit', el); st.visitId = vs ? (vs.value || null) : null;
    if (!st.placeId && (st.kind === 'michinoeki' || st.kind === 'station') && !confirm('場所が選ばれていません。このまま保存しますか？')) return;
    const now = Date.now();
    const old = isNew ? null : state.stamps.find(x => x.id === st.id);
    const rec = {
      ...st, id: st.id || uid(), createdAt: st.createdAt || now, updatedAt: now,
      ...(processed ? { photo: processed.photo.blob, thumb: processed.thumb.blob, width: processed.photo.width, height: processed.photo.height } : {}),
    };
    // 写真を紐づけた訪問が「スタンプ未取得」のままなら取得済みにする
    const visit = rec.visitId ? state.visits.find(v => v.id === rec.visitId) : null;
    const fixVisit = visit && !visit.stampObtained;
    await db.tx(['stamps', 'visits'], 'readwrite', t => {
      t.objectStore('stamps').put(rec);
      if (fixVisit) { visit.stampObtained = true; visit.updatedAt = now; t.objectStore('visits').put(visit); }
    });
    if (old) { forgetUrls(old); state.stamps[state.stamps.indexOf(old)] = rec; } else state.stamps.push(rec);
    state.pending = null;
    reindexVisits();
    toast(fixVisit ? '保存しました（訪問記録を「スタンプ取得」にしました）' : '保存しました');
    back();
  };

  const remove = async () => {
    if (!confirm('このスタンプ写真を削除しますか？')) return;
    await db.del('stamps', st.id);
    const old = state.stamps.find(x => x.id === st.id);
    if (old) forgetUrls(old);
    state.stamps = state.stamps.filter(x => x.id !== st.id);
    reindexVisits();
    toast('削除しました');
    back();
  };

  draw();
  if (isNew) await runProcess(state.pending.file);
}

/* ---------- 訪問記録一覧 ---------- */

    .map(([k, l]) => `<button class="chip" data-rt="${k}" aria-pressed="${state.recordTab === k}">${l}</button>`).join('');

    const b = e.target.closest('[data-rt]'); if (!b) return;

  const arr = [...state.visits].sort((a, b) => b.visitedDate.localeCompare(a.visitedDate) || b.createdAt - a.createdAt);

/* ---------- 統計 ---------- */
function renderStats() {
  const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
  const all = [...state.places.values()];
  // 道の駅の分母は「閉鎖」以外（取り込み＋手動追加）。休止中は数に入れる
  const eki = all.filter(p => p.type === 'michinoeki' && isActive(p));
  const st = p => state.byPlace.get(p.id);
  const ekiVisited = eki.filter(p => st(p)?.visited).length, ekiStamp = eki.filter(p => st(p)?.stamp).length;
  const visitCount = state.visits.filter(v => v.visited).length;
  const visitedOf = g => all.filter(p => groupOf(p) === g && st(p)?.visited).length;
  const stampsBy = k => state.stamps.filter(x => x.kind === k).length;
  // 都道府県別
  const rows = PREFS.map((pref, i) => {
    const ps = eki.filter(p => p.prefecture === pref);
    const v = ps.filter(p => st(p)?.visited).length, sp = ps.filter(p => st(p)?.stamp).length;
    return { pref, i, total: ps.length, v, sp, rate: pct(v, ps.length) };
  });
  const sorted = [...rows].sort(state.statsSort === 'rate' ? (a, b) => b.rate - a.rate || b.v - a.v || a.i - b.i
    : state.statsSort === 'count' ? (a, b) => b.v - a.v || b.rate - a.rate || a.i - b.i : (a, b) => a.i - b.i);
  const done = rows.filter(r => r.total && r.v === r.total).length;
  // 年別の訪問回数
  const years = {};
  for (const v of state.visits) if (v.visited) years[v.visitedDate.slice(0, 4)] = (years[v.visitedDate.slice(0, 4)] || 0) + 1;
  const ys = Object.entries(years).sort((a, b) => b[0].localeCompare(a[0]));
  const ymax = Math.max(1, ...ys.map(y => y[1]));

  $('#statsBox').innerHTML = `
    <div class="card">
      <div class="note">道の駅の達成率</div>
      <div class="stat-big"><b>${pct(ekiVisited, eki.length)}%</b><span>${ekiVisited.toLocaleString()} / ${eki.length.toLocaleString()} 駅を訪問</span></div>
      <div class="bar" style="margin:8px 0 4px"><i style="width:${pct(ekiVisited, eki.length)}%"></i></div>
      <div class="note">スタンプ取得 ${ekiStamp.toLocaleString()} 駅（${pct(ekiStamp, eki.length)}%）・全駅訪問した都道府県 ${done}</div>
      <div class="stat-grid">
        <div><b>${visitCount}</b><span>訪問回数</span></div>
        <div><b>${visitedOf('station')}</b><span>訪問した駅</span></div>
        <div><b>${visitedOf('spot')}</b><span>記念・その他</span></div>
        <div><b>${state.stamps.length}</b><span>スタンプ写真</span></div>
        <div><b>${stampsBy('michinoeki')}</b><span>うち道の駅</span></div>
        <div><b>${stampsBy('station')}</b><span>うち駅</span></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0"><span>都道府県別（道の駅）</span>
        <select id="statsSort" aria-label="並び順" style="height:34px;border-radius:17px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13px">
          <option value="pref"${state.statsSort === 'pref' ? ' selected' : ''}>都道府県順</option>
          <option value="rate"${state.statsSort === 'rate' ? ' selected' : ''}>達成率順</option>
          <option value="count"${state.statsSort === 'count' ? ' selected' : ''}>訪問数順</option>
        </select></div>
      <div class="note" style="margin-bottom:6px">緑＝訪問、朱＝そのうちスタンプ取得。タップするとその都道府県の一覧を開きます。★は全駅訪問。</div>
      <div class="pref-rows">${sorted.map(r => `
        <button class="pref-row${r.total && r.v === r.total ? ' done' : ''}" data-pref="${r.pref}">
          <span class="nm">${r.pref.replace(/(都|府|県)$/, '') || r.pref}</span>
          <span class="bar">${r.sp ? `<i class="s" style="width:${pct(r.sp, r.total)}%"></i>` : ''}<i style="width:${pct(r.v - r.sp, r.total)}%"></i></span>
          <span class="num">${r.v}/${r.total}</span>
        </button>`).join('')}</div>
    </div>
    ${ys.length ? `<div class="card"><div class="section-title" style="margin-top:0"><span>年ごとの訪問回数</span></div>
      <div class="year-rows">${ys.map(([y, n]) => `<span>${y}年</span><span class="bar"><i style="width:${n / ymax * 100}%"></i></span><span>${n}回</span>`).join('')}</div></div>` : ''}
  `;
  $('#statsSort').onchange = e => { state.statsSort = e.target.value; ls.set('statsSort', state.statsSort); renderStats(); };
  $('#statsBox .pref-rows').onclick = e => {
    const b = e.target.closest('[data-pref]'); if (!b) return;
    filters.type = 'michinoeki'; filters.pref = b.dataset.pref; filters.q = ''; $('#q').value = '';
    $('#fPref').value = filters.pref; renderTypeChips(); ls.set('filters', filters); state.listLimit = 80;
    go('/list');
  };
}

/* ---------- バックアップ（ZIP 書き出し・読み込み） ---------- */
// ZIP の中身: manifest.json（形式・件数）/ data.json（場所・訪問・スタンプ・評価項目）/ photos/*.jpg / thumbs/*.jpg
const BACKUP_FORMAT = 1;
const BACKUP_WARN_DAYS = 14;
const plain = o => Object.fromEntries(Object.entries(o).filter(([k]) => !k.startsWith('_')));   // 画面用の一時項目（_k など）を落とす

// 手動追加・編集した場所と、記録が紐づいている場所は必ず含める（同梱データから作り直せない情報を落とさないため）
function backupPlaces() {
  return [...state.places.values()].filter(p => p.source === 'manual' || p.edited || state.byPlace.has(p.id)).map(plain);
}
function userDataCount() {
  return state.visits.length + state.stamps.length + [...state.places.values()].filter(p => p.source === 'manual' || p.edited).length;
}
function changesSince(t) {
  const n = a => a.filter(x => (x.updatedAt || x.createdAt || 0) > t).length;
  return n(state.visits) + n(state.stamps) + n([...state.places.values()].filter(p => p.source === 'manual' || p.edited));
}
function backupStatus() {
  if (!userDataCount()) return null;
  const lb = state.lastBackup;
  if (!lb) return { warn: true, text: 'まだバックアップがありません。写真や記録はこの端末のブラウザ内にしか無いため、ZIP で保存しておきましょう。' };
  const days = Math.floor((Date.now() - lb.at) / 864e5), changed = changesSince(lb.at);
  const text = `最終バックアップ：${new Date(lb.at).toLocaleString('ja-JP', { dateStyle: 'medium', timeStyle: 'short' })}（${days ? days + '日前' : '今日'}）${changed ? `・その後の変更 ${changed} 件` : '・その後の変更なし'}`;
  return { warn: days >= BACKUP_WARN_DAYS && changed > 0, days, changed, text };
}
function renderBackupBanner() {
  const box = $('#backupBanner');
  const st = backupStatus();
  const snoozed = ls.get('backupSnooze', '') === today();
  if (!st?.warn || snoozed) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="banner warn"><span>⚠ ${st.days != null ? `前回のバックアップから ${st.days} 日たちました（その後の変更 ${st.changed} 件）。` : 'まだバックアップがありません。'}</span>
    <button id="bkGo">バックアップする</button><button class="later" id="bkLater">今日は表示しない</button></div>`;
  $('#bkGo').onclick = () => { go('/settings'); };
  $('#bkLater').onclick = () => { ls.set('backupSnooze', today()); renderBackupBanner(); };
}

async function buildBackup(onProgress) {
  const zip = new JSZip();
  const now = new Date();
  const stamps = state.stamps.map(st => {
    const { photo, thumb, ...m } = plain(st);
    if (photo) zip.file(`photos/${st.id}.jpg`, photo, { compression: 'STORE' });   // JPEG は圧縮しても縮まない
    if (thumb) zip.file(`thumbs/${st.id}.jpg`, thumb, { compression: 'STORE' });
    return { ...m, photoFile: photo ? `photos/${st.id}.jpg` : null, thumbFile: thumb ? `thumbs/${st.id}.jpg` : null };
  });
  const data = { places: backupPlaces(), visits: state.visits.map(plain), stamps, ratingItems: state.ratingItems };
  const meta = await db.get('meta', 'dataVersion');
  const manifest = {
    app: APP_KEY, format: BACKUP_FORMAT, appVersion: APP_VERSION, exportedAt: now.toISOString(), dataVersion: meta?.value || null,
    counts: { places: data.places.length, visits: data.visits.length, stamps: stamps.length, photos: stamps.filter(x => x.photoFile).length },
  };
  zip.file('manifest.json', JSON.stringify(manifest, null, 1));
  zip.file('data.json', JSON.stringify(data));
  zip.file('README.txt', '道の駅スタンプ帳のバックアップです。\r\nアプリの「設定」→「バックアップから復元」で読み込めます。\r\n中の写真と記録は個人の記録です。他の人と共有しないでください。\r\n');
  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/zip', compression: 'DEFLATE', compressionOptions: { level: 6 } },
    m => onProgress && onProgress(Math.round(m.percent)));
  const pad = n => String(n).padStart(2, '0');
  const name = `michieki-stamp-backup-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.zip`;
  return { blob, name, manifest };
}
async function markBackedUp(b) {
  state.lastBackup = { key: 'lastBackup', at: Date.now(), name: b.name, counts: b.manifest.counts };
  await db.put('meta', state.lastBackup);
  renderBackupBanner();
  if (currentView === 'settings') renderSettings();
}

// 共有シート（iPhone では「"ファイル"に保存」で iCloud Drive などへ）。タップの処理の中で await を挟まずに呼ぶこと
function shareBackup(b) {
  const file = new File([b.blob], b.name, { type: 'application/zip' });
  navigator.share({ files: [file], title: b.name })
    .then(() => { markBackedUp(b); toast('バックアップを保存しました'); })
    .catch(e => { if (e.name !== 'AbortError') toast('共有できませんでした。「ダウンロード」を試してください'); });
}
function downloadBackup(b) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b.blob); a.download = b.name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  markBackedUp(b);
  toast('ダウンロードしました。保存先を確認してください');
}

async function readBackup(file) {
  let zip;
  try { zip = await JSZip.loadAsync(file); } catch { throw new Error('ZIP ファイルとして読めませんでした'); }
  const mf = zip.file('manifest.json'), df = zip.file('data.json');
  if (!mf || !df) throw new Error('このアプリのバックアップではありません（manifest.json / data.json がありません）');
  const manifest = JSON.parse(await mf.async('string'));
  if (manifest.app !== APP_KEY) throw new Error('このアプリのバックアップではありません');
  if (manifest.format > BACKUP_FORMAT) throw new Error('新しい版のアプリで作られたバックアップです。アプリを更新してから読み込んでください');
  const data = JSON.parse(await df.async('string'));
  for (const k of ['places', 'visits', 'stamps']) if (!Array.isArray(data[k])) throw new Error(`バックアップの中身が壊れています（${k}）`);
  return { zip, manifest, data, fileName: file.name };
}

// 復元。overwrite: この端末の記録をバックアップの内容に置き換える / merge: 足し合わせ、同じ記録は更新日時の新しい方を残す
async function applyRestore(r, mode) {
  const { zip, data } = r;
  const valid = x => x && typeof x.id === 'string';
  const places = data.places.filter(p => valid(p) && p.name);
  const visits = data.visits.filter(v => valid(v) && v.placeId && v.visitedDate);
  const stamps = [], missing = [];
  for (const m of data.stamps.filter(valid)) {
    const ph = m.photoFile && zip.file(m.photoFile), th = m.thumbFile && zip.file(m.thumbFile);
    if (!ph) { missing.push(m.id); continue; }   // 写真の無いスタンプ記録は読み込まない
    const photo = new Blob([await ph.async('arraybuffer')], { type: 'image/jpeg' });
    const thumb = th ? new Blob([await th.async('arraybuffer')], { type: 'image/jpeg' }) : photo;
    const { photoFile, thumbFile, ...rest } = m;
    stamps.push({ ...rest, photo, thumb });
  }
  const newer = (inc, cur) => !cur || (inc.updatedAt || inc.createdAt || 0) > (cur.updatedAt || cur.createdAt || 0);
  let added = 0, updated = 0, kept = 0;
  await db.tx(['places', 'visits', 'stamps', 'meta'], 'readwrite', t => {
    const P = t.objectStore('places'), V = t.objectStore('visits'), S = t.objectStore('stamps'), M = t.objectStore('meta');
    if (mode === 'overwrite') {
      V.clear(); S.clear();
      // 手動追加・編集した場所は消し、取り込みデータは次の起動時の更新で元に戻す
      for (const p of state.places.values()) if (p.source === 'manual' || p.edited) P.delete(p.id);
      M.delete('dataVersion');
      for (const p of places) P.put(p);
      for (const v of visits) V.put(v);
      for (const st of stamps) S.put(st);
      if (Array.isArray(data.ratingItems) && data.ratingItems.length) M.put({ key: 'ratingItems', items: data.ratingItems });
      added = places.length + visits.length + stamps.length;
      return;
    }
    const localV = new Map(state.visits.map(v => [v.id, v])), localS = new Map(state.stamps.map(x => [x.id, x]));
    const put = (store, inc, cur) => { if (newer(inc, cur)) { store.put(inc); cur ? updated++ : added++; } else kept++; };
    for (const p of places) put(P, p, state.places.get(p.id));
    for (const v of visits) put(V, v, localV.get(v.id));
    for (const st of stamps) put(S, st, localS.get(st.id));
    // 評価項目は、この端末に無い項目だけ後ろに足す（並び・名前はこの端末の設定を優先）
    if (Array.isArray(data.ratingItems)) {
      const have = new Set(state.ratingItems.map(i => i.key));
      const items = [...state.ratingItems, ...data.ratingItems.filter(i => i?.key && !have.has(i.key))];
      M.put({ key: 'ratingItems', items });
    }
  });
  return { added, updated, kept, skippedStamps: missing.length };
}

function renderBackupCard() {
  const st = backupStatus();
  const b = state.backup, r = state.restore;
  const card = $('#backupCard');
  if (!card) return;
  const mb = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + 'KB' : (n / 1048576).toFixed(1) + 'MB';
  const canShare = b && navigator.canShare && navigator.canShare({ files: [new File([b.blob], b.name, { type: 'application/zip' })] });
  card.innerHTML = `
    <h3>バックアップ</h3>
    <p>${st ? esc(st.text) : 'まだ記録がありません。'}</p>
    <p class="note">記録と写真は、この端末のブラウザの中だけにあります。iPhone では長く使わないと消えることがあり、機種変更でも引き継がれません。
      定期的に ZIP で保存してください（「ファイル」アプリの iCloud Drive など）。${BACKUP_WARN_DAYS}日以上たって変更があると、一覧に警告を出します。</p>
    <div class="btn-row"><button class="btn" id="bkMake">バックアップを作成</button></div>
    ${b ? `<div class="bk-box">作成しました：${esc(b.name)}（${mb(b.blob.size)}・場所 ${b.manifest.counts.places}／訪問 ${b.manifest.counts.visits}／スタンプ ${b.manifest.counts.stamps}）
      <div class="btn-row">${canShare ? '<button class="btn" id="bkShare">共有・"ファイル"に保存</button>' : ''}<button class="btn ${canShare ? 'ghost' : ''}" id="bkDl">ダウンロード</button></div></div>` : ''}
    <div class="btn-row"><button class="btn ghost" id="bkOpen">バックアップから復元…</button></div>
    ${r ? `<div class="bk-box">
      <b>${esc(r.fileName)}</b><br>作成：${new Date(r.manifest.exportedAt).toLocaleString('ja-JP')}（v${esc(r.manifest.appVersion)}）<br>
      場所 ${r.data.places.length}・訪問 ${r.data.visits.length}・スタンプ ${r.data.stamps.length}
      <label><input type="radio" name="bkMode" value="merge" checked><span><b>マージ</b>：この端末の記録に足す。同じ記録は更新日時が新しい方を残す</span></label>
      <label><input type="radio" name="bkMode" value="overwrite"><span><b>上書き</b>：この端末の記録・写真・手動追加した場所を消して、バックアップの内容に置き換える</span></label>
      <div class="btn-row"><button class="btn" id="bkApply">読み込む</button><button class="btn ghost" id="bkCancel">やめる</button></div></div>` : ''}
  `;
  $('#bkMake').onclick = async e => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      state.backup = await buildBackup(p => { btn.textContent = `作成中… ${p}%`; });
      renderBackupCard();
    } catch (err) { toast('作成できませんでした：' + (err.message || err)); btn.disabled = false; btn.textContent = 'バックアップを作成'; }
  };
  const sh = $('#bkShare'); if (sh) sh.onclick = () => shareBackup(state.backup);
  const dl = $('#bkDl'); if (dl) dl.onclick = () => downloadBackup(state.backup);
  $('#bkOpen').onclick = () => {
    const inp = $('#zipInput'); inp.value = '';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try { state.restore = await readBackup(f); } catch (err) { state.restore = null; toast(err.message); }
      renderBackupCard();
    };
    inp.click();
  };
  const cancel = $('#bkCancel'); if (cancel) cancel.onclick = () => { state.restore = null; renderBackupCard(); };
  const apply = $('#bkApply');
  if (apply) apply.onclick = async () => {
    const mode = card.querySelector('input[name=bkMode]:checked').value;
    if (mode === 'overwrite' && !confirm(`この端末の訪問記録 ${state.visits.length} 件・スタンプ写真 ${state.stamps.length} 枚・手動追加/編集した場所はすべて消え、バックアップの内容に置き換わります。\n\n本当に上書きしますか？`)) return;
    apply.disabled = true; apply.textContent = '読み込み中…';
    try {
      const res = await applyRestore(state.restore, mode);
      ls.set('flash', mode === 'overwrite' ? `上書きで復元しました（${res.added} 件）${res.skippedStamps ? `・写真の無いスタンプ ${res.skippedStamps} 件は読み込みませんでした` : ''}`
        : `マージしました（追加 ${res.added}・更新 ${res.updated}・この端末の方が新しく残した ${res.kept}）${res.skippedStamps ? `・写真の無いスタンプ ${res.skippedStamps} 件は除外` : ''}`);
      location.reload();   // 読み直して画面と集計を作り直す
    } catch (err) { toast('読み込めませんでした：' + (err.message || err)); apply.disabled = false; apply.textContent = '読み込む'; }
  };
}

/* ---------- ホーム画面への追加（PWA） ---------- */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installCardHtml() {
  if (isStandalone()) return `<div class="card"><h3>ホーム画面のアプリ</h3><p>ホーム画面から起動しています。通信できない場所でも記録できます（地図の画像は通信できるときだけ表示）。</p></div>`;
  return `<div class="card" id="installCard"><h3>ホーム画面に追加しましょう</h3>
    <p>ホーム画面に追加すると、アプリのように起動でき、通信できない場所でも記録できます。iPhone では、ブラウザのデータが消されにくくもなります。</p>
    ${isIOS() ? `<ol class="install-steps"><li>Safari でこのページを開く</li><li>画面下の共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」→「追加」</li></ol>`
      : state.installPrompt ? '<div class="btn-row"><button class="btn" id="installBtn">ホーム画面に追加（インストール）</button></div>'
      : '<p class="note">ブラウザのメニューから「ホーム画面に追加」または「アプリをインストール」を選んでください。</p>'}
  </div>`;
}
// iPhone の Safari で開いているときは、一覧の上にも一度だけ案内を出す（閉じたら出さない）
function renderInstallBanner() {
  const box = $('#installBanner');
  if (isStandalone() || !isIOS() || ls.get('installHintClosed', false)) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="banner warn" style="background:var(--accent-soft);color:var(--accent)"><span>ホーム画面に追加すると、アプリのように使え、記録も消えにくくなります。</span>

function bindInstall() {
  const b = $('#installBtn');
  if (b) b.onclick = async () => {
    const p = state.installPrompt; state.installPrompt = null;
    p.prompt();
    const r = await p.userChoice;

}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); state.installPrompt = e; if (currentView === 'settings') renderSettings(); });

/* ---------- Service Worker（オフライン対応・更新の知らせ） ---------- */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const hadController = !!navigator.serviceWorker.controller;   // 初回インストール時は知らせを出さない
  navigator.serviceWorker.register('sw.js').then(reg => {
    // 以前の版（v0.6.1 まで）で「待機中」のまま残った Service Worker があれば切り替えを頼む
    if (reg.waiting) reg.waiting.postMessage('skipWaiting');
    // 開いたままでも時々更新を確かめる
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  // 新しい版に切り替わったら、開いている画面が古いときだけ知らせる。
  // ボタンは画面を読み直すだけ（Service Worker とのやりとりに頼らない）
  navigator.serviceWorker.addEventListener('controllerchange', async () => {
    if (!hadController) return;
    // 切り替わった直後は古い版の保存データもまだ残っているので、版番号を比べて「この画面より新しい版」があるときだけ出す
    const keys = await caches.keys().catch(() => []);
    const vers = keys.filter(k => k.startsWith(APP_KEY + '-')).map(k => k.slice(APP_KEY.length + 1));
    if (vers.some(v => cmpVersion(v, APP_VERSION) > 0)) showUpdateBar();
  });
}
function cmpVersion(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0), pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  return 0;
}
function showUpdateBar() {
  const bar = $('#updateBar');
  bar.hidden = false;
  $('#updateBtn').disabled = false;
  $('#updateBtn').onclick = () => { $('#updateBtn').disabled = true; location.reload(); };
  $('#updateClose').onclick = () => { bar.hidden = true; };
}

  const all = [...state.places.values()];
  const manual = all.filter(p => p.source === 'manual').length;
  const edited = all.filter(p => p.edited).length;
  const missing = all.filter(p => p.missingFromSource).length;
  $('#v-settings').innerHTML = `
    ${installCardHtml()}
    <div class="card" id="backupCard"></div>
    <div class="card">
      <h3>評価項目</h3>
      <p class="note">名前の変更・並べ替え・非表示・削除をしても、過去の記録に付けた評価は消えません（非表示・削除した項目は表示されなくなるだけです）。</p>
      <ul class="ri-list" id="riList">${state.ratingItems.map((it, i) => `
